# Core site metadata
locale: "en-US"
title: "Shiyu Hu"
title_separator: "-"
name: "Shiyu Hu"
description: "Shiyu Hu - Research Fellow at Nanyang Technological University working on reliable multimodal intelligence."
url: "https://hushiyu1995.com"
baseurl: ""
repository: "huuuuusy/huuuuusy.github.io"
timezone: "Asia/Singapore"

# Rendering
breadcrumbs: false
future: true
words_per_minute: 160
read_more: "disabled"
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

compress_html:
  clippings: all
  ignore:
    envs: development

# Author profile
author:
  name: "Shiyu Hu"
  avatar: "profile.jpg"
  bio: "Research Fellow at Nanyang Technological University. I study reliable multimodal intelligence in open and interactive environments."
  location: "Singapore"
  googlescholar: "https://scholar.google.com/citations?user=49W-Rx4AAAAJ"
  email: "shiyu.hu@ntu.edu.sg"
  researchgate: "https://www.researchgate.net/profile/Shiyu-Hu-8"
  github: "huuuuusy"
  linkedin: "hushiyu1995/?locale=en_US"
  orcid: "https://orcid.org/0000-0002-5872-7566"
  zhihu: "https://www.zhihu.com/people/hushiyu1995"

# Pages and static downloads
include:
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - LICENSE
  - README.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - package.json
  - tmp
  - vendor

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Analytics and GitHub Pages plugins
analytics:
  provider: "custom"

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
