# Core site metadata
locale: "en-US"
title: "Shiyu Hu"
title_separator: "-"
name: "Shiyu Hu"
description: "Shiyu Hu - Research Fellow at Nanyang Technological University working on reliable multimodal intelligence."
url: "https://hushiyu1995.com"
baseurl: ""
repository: "huuuuusy/huuuuusy.github.io"
timezone: "Asia/Singapore"

# Homepage metadata
homepage:
  last_updated: "2026-08"

# Optional public visitor statistics. Forks can set enabled to false without
# editing templates or JavaScript.
visitor_insights:
  enabled: true
  endpoints:
    - "https://counter.hushiyu1995.com/"
    - "https://shiyu-homepage-counter.hushiyu199510.workers.dev/"
  legacy_count: 15000
  note: "Cumulative total includes approximately 15,000 legacy visits estimated from MapMyVisitors (Feb. 9–Apr. 18, 2024) and ClustrMaps (Apr. 18, 2024–approximately May 27, 2026), plus first-party page views recorded since July 27, 2026. Each page load or refresh is counted. Historical regional figures are proportionally reconstructed; recent period statistics are exact first-party aggregates and do not include the legacy estimate."

# Rendering
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

compress_html:
  clippings: all
  ignore:
    envs: development

# Author profile
author:
  name: "Shiyu Hu"
  avatar: "profile.jpg"
  bio: "Research Fellow at Nanyang Technological University. I study how AI capabilities can be measured, diagnosed, and modeled in open contexts."
  location: "Singapore"
  googlescholar: "https://scholar.google.com/citations?user=49W-Rx4AAAAJ"
  email: "shiyu.hu@ntu.edu.sg"
  researchgate: "https://www.researchgate.net/profile/Shiyu-Hu-8"
  github: "huuuuusy"
  linkedin: "hushiyu1995/?locale=en_US"
  orcid: "https://orcid.org/0000-0002-5872-7566"
  zhihu: "https://www.zhihu.com/people/hushiyu1995"

# Pages and static downloads
include:
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - cloudflare
  - docs
  - node_modules
  - scripts
  - tmp
  - vendor

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single

# Analytics and GitHub Pages plugins
analytics:
  provider: "custom"
  cloudflare_token: "fa5370345e8f4dcc8362695323fb5d63"

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
