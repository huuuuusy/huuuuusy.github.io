<div class="publication-browser" data-publication-group="{{ include.group }}" aria-live="polite">
  <p class="publication-browser__note">{{ include.note }}</p>
  <button class="section-more publication-toggle" data-publication-toggle="{{ include.group }}" type="button" aria-expanded="false" hidden>
    <span class="publication-toggle__label">{{ include.label }}</span>
    <span class="publication-toggle__icon" aria-hidden="true">↓</span>
  </button>
</div>
