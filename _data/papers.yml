CEAI-adaptive:
  source: "DOI 10.1016/j.caeai.2025.100429 (Crossref/Elsevier; vol. 9, article 100429); abstract from the Elsevier record via OpenAlex (ScienceDirect page blocked automated access); first author given name per official record (Le Ying; CV has Leying)"
  abstract: >-
    This review provides a comprehensive analysis of adaptive learning platforms (ALPs) in
    education, focusing on their pedagogical foundations, AI-driven implementations, and the
    challenges and successes of real-world applications. By collecting and analyzing learner data,
    ALPs dynamically adjust instructional content and pathways to offer personalized learning
    experiences, enhancing learning outcomes. The paper explores ALP design frameworks, core
    algorithms, and evaluation metrics, and assesses their performance across diverse educational
    contexts through case studies. Lastly, the review highlights key challenges ALPs face, such as
    privacy concerns and faculty support for implementation, and offers insights into future trends
    in developing adaptive technologies. This review provides educators and researchers with
    valuable insights into how ALPs can be effectively applied in various educational settings.
  contributions:
    - "Reviews AI-enabled adaptive learning platforms, covering their pedagogical foundations, AI-driven implementations, design frameworks, core algorithms and evaluation metrics."
    - "Assesses platform performance across diverse educational contexts through case studies of real-world applications."
    - "Identifies key challenges such as privacy concerns and faculty support for implementation, and outlines future trends in developing adaptive learning technologies."
