SOI-V2:
  source: "arXiv:2508.09524 (arXiv API record, v2); abstract from arXiv:2508.09524; BibTeX follows arXiv's own export for the latest version (v2, checked 2026-10-21)"
  abstract: >-
    In this paper, we present the first systematic investigation and quantification of Similar
    Object Interference (SOI), a long-overlooked yet critical bottleneck in Single Object Tracking
    (SOT). Through controlled Online Interference Masking (OIM) experiments, we quantitatively
    demonstrate that eliminating interference sources leads to substantial performance improvements
    (AUC gains up to 4.35) across all SOTA trackers, directly validating SOI as a primary constraint
    for robust tracking and highlighting the feasibility of external cognitive guidance. Building
    upon these insights, we adopt natural language as a practical form of external guidance, and
    construct SOIBench-the first semantic cognitive guidance benchmark specifically targeting SOI
    challenges. It automatically mines SOI frames through multi-tracker collective judgment and
    introduces a multi-level annotation protocol to generate precise semantic guidance texts.
    Systematic evaluation on SOIBench reveals a striking finding: existing vision-language tracking
    (VLT) methods fail to effectively exploit semantic cognitive guidance, achieving only marginal
    improvements or even performance degradation (AUC changes of -0.26 to +0.71). In contrast, we
    propose a novel paradigm employing large-scale vision-language models (VLM) as external
    cognitive engines that can be seamlessly integrated into arbitrary RGB trackers. This approach
    demonstrates substantial improvements under semantic cognitive guidance (AUC gains up to 0.93),
    representing a significant advancement over existing VLT methods. We hope SOIBench will serve as
    a standardized evaluation platform to advance semantic cognitive tracking research and
    contribute new insights to the tracking research community.
  contributions:
    - "Quantifies Similar Object Interference (SOI) in single object tracking through Online Interference Masking experiments, showing AUC gains of up to 4.35 for SOTA trackers when interference is removed."
    - "Builds SOIBench, a semantic cognitive guidance benchmark that mines SOI frames by multi-tracker collective judgment and annotates guidance texts with a multi-level protocol."
    - "Proposes using large vision-language models as external cognitive engines for any RGB tracker, gaining up to 0.93 AUC where existing VLT methods change by only -0.26 to +0.71."
  bibtex: |-
    @misc{wang2025soi,
      title         = {{SOI} is the Root of All Evil: Quantifying and Breaking Similar Object Interference in Single Object Tracking},
      author        = {Wang, Yipei and Hu, Shiyu and Jia, Shukun and Xu, Panxi and Ma, Hongfei and Ma, Yiping and Zhang, Jing and Lu, Xiaobo and Zhao, Xin},
      year          = {2025},
      eprint        = {2508.09524},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2508.09524}
    }

VLTVerse:
  source: "arXiv:2411.15600 (arXiv API record, v1); abstract from arXiv:2411.15600 (\\url{} markup removed); BibTeX follows arXiv's own export for the latest version (v1, checked 2026-10-21)"
  abstract: >-
    Vision-language tracking (VLT) extends traditional single object tracking by incorporating
    textual information, providing semantic guidance to enhance tracking performance under
    challenging conditions like fast motion and deformations. However, current VLT trackers often
    underperform compared to single-modality methods on multiple benchmarks, with semantic
    information sometimes becoming a "distraction." To address this, we propose VLTVerse, the first
    fine-grained evaluation framework for VLT trackers that comprehensively considers multiple
    challenge factors and diverse semantic information, hoping to reveal the role of language in
    VLT. Our contributions include: (1) VLTVerse introduces 10 sequence-level challenge labels and 6
    types of multi-granularity semantic information, creating a flexible and multi-dimensional
    evaluation space for VLT; (2) leveraging 60 subspaces formed by combinations of challenge
    factors and semantic types, we conduct systematic fine-grained evaluations of three mainstream
    SOTA VLT trackers, uncovering their performance bottlenecks across complex scenarios and
    offering a novel perspective on VLT evaluation; (3) through decoupled analysis of experimental
    results, we examine the impact of various semantic types on specific challenge factors in
    relation to different algorithms, providing essential guidance for enhancing VLT across data,
    evaluation, and algorithmic dimensions. The VLTVerse, toolkit, and results will be available at
    http://metaverse.aitestunion.com.
  contributions:
    - "Proposes VLTVerse, a fine-grained evaluation framework for vision-language trackers with 10 sequence-level challenge labels and 6 types of multi-granularity semantic information."
    - "Evaluates three mainstream SOTA VLT trackers across 60 subspaces combining challenge factors and semantic types, exposing their bottlenecks in complex scenarios."
    - "Analyzes how each semantic type affects specific challenge factors for different algorithms, giving guidance on data, evaluation and algorithm design for VLT."
  bibtex: |-
    @misc{li2024texts,
      title         = {How Texts Help? A Fine-grained Evaluation to Reveal the Role of Language in Vision-Language Tracking},
      author        = {Li, Xuchen and Hu, Shiyu and Feng, Xiaokun and Zhang, Dailing and Wu, Meiqi and Zhang, Jing and Huang, Kaiqi},
      year          = {2024},
      eprint        = {2411.15600},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2411.15600}
    }

STEMVerse:
  source: "arXiv:2602.02497 (arXiv API record, v1); abstract from arXiv:2602.02497 ($\\times$ rendered as ×); BibTeX follows arXiv's own export for the latest version (v1, checked 2026-10-21)"
  abstract: >-
    As Large Language Models (LLMs) achieve significant breakthroughs in complex reasoning tasks,
    evaluating their proficiency in science, technology, engineering, and mathematics (STEM) has
    become a primary method for measuring machine intelligence. However, current evaluation
    paradigms often treat benchmarks as isolated "silos," offering only monolithic aggregate scores
    that neglect the intricacies of both academic specialization and cognitive depth. This
    result-oriented approach fails to distinguish whether model errors stem from insufficient domain
    knowledge or deficiencies in cognitive capacity, thereby limiting the diagnostic value. To
    address this, we propose STEMVerse, a diagnostic framework designed to systematically analyze
    the STEM reasoning capabilities of LLMs. This framework characterizes model performance across
    academic specialization and cognitive complexity to map the capability required for reasoning.
    We re-aggregate over 20,000 STEM problems from mainstream benchmarks into a unified "Discipline
    × Cognition" capability space, assigning dual-axis labels to every instance. Utilizing this
    unified diagnostic framework, we systematically evaluate representative LLM families across
    varying parameter scales and training paradigms. Our empirical results reveal structural failure
    patterns in STEM reasoning. By integrating multi-disciplinary coverage and fine-grained
    cognitive stratification into a unified framework, STEMVerse provides a clear and actionable
    perspective for understanding the scientific reasoning characteristics of LLMs.
  contributions:
    - "Proposes STEMVerse, a diagnostic framework that characterizes LLM STEM reasoning along two axes, academic discipline and cognitive complexity."
    - "Re-aggregates over 20,000 STEM problems from mainstream benchmarks into a unified \"Discipline × Cognition\" capability space with dual-axis labels on every instance."
    - "Evaluates representative LLM families across parameter scales and training paradigms, revealing structural failure patterns in STEM reasoning."
  bibtex: |-
    @misc{li2026stemverse,
      title         = {{STEMVerse}: A Dual-Axis Diagnostic Framework for {STEM} Reasoning in Large Language Models},
      author        = {Li, Xuzhao and Li, Xuchen and Zhao, Jian and Hu, Shiyu},
      year          = {2026},
      eprint        = {2602.02497},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CL},
      url           = {https://arxiv.org/abs/2602.02497}
    }

DTVLT:
  source: "arXiv:2410.02492 (arXiv API record, v2); abstract from arXiv:2410.02492; BibTeX follows arXiv's own export for the latest version (v2, checked 2026-10-21)"
  abstract: >-
    Visual language tracking (VLT) has emerged as a cutting-edge research area, harnessing
    linguistic data to enhance algorithms with multi-modal inputs and broadening the scope of
    traditional single object tracking (SOT) to encompass video understanding applications. Despite
    this, most VLT benchmarks still depend on succinct, human-annotated text descriptions for each
    video. These descriptions often fall short in capturing the nuances of video content dynamics
    and lack stylistic variety in language, constrained by their uniform level of detail and a fixed
    annotation frequency. As a result, algorithms tend to default to a "memorize the answer"
    strategy, diverging from the core objective of achieving a deeper understanding of video
    content. Fortunately, the emergence of large language models (LLMs) has enabled the generation
    of diverse text. This work utilizes LLMs to generate varied semantic annotations (in terms of
    text lengths and granularities) for representative SOT benchmarks, thereby establishing a novel
    multi-modal benchmark. Specifically, we (1) propose a new visual language tracking benchmark
    with diverse texts, named DTVLT, based on five prominent VLT and SOT benchmarks, including three
    sub-tasks: short-term tracking, long-term tracking, and global instance tracking. (2) We offer
    four granularity texts in our benchmark, considering the extent and density of semantic
    information. We expect this multi-granular generation strategy to foster a favorable environment
    for VLT and video understanding research. (3) We conduct comprehensive experimental analyses on
    DTVLT, evaluating the impact of diverse text on tracking performance and hope the identified
    performance bottlenecks of existing algorithms can support further research in VLT and video
    understanding. The proposed benchmark, experimental results and toolkit will be released
    gradually on http://videocube.aitestunion.com/.
  contributions:
    - "Builds DTVLT, a visual language tracking benchmark with LLM-generated diverse texts on five prominent VLT and SOT benchmarks, covering short-term, long-term and global instance tracking."
    - "Provides texts at four granularities that vary the extent and density of semantic information, moving beyond single, uniform human annotations."
    - "Evaluates how diverse text affects tracking performance and identifies bottlenecks of existing algorithms for VLT and video understanding."
  bibtex: |-
    @misc{li2024dtvlt,
      title         = {{DTVLT}: A Multi-modal Diverse Text Benchmark for Visual Language Tracking Based on {LLM}},
      author        = {Li, Xuchen and Hu, Shiyu and Feng, Xiaokun and Zhang, Dailing and Wu, Meiqi and Zhang, Jing and Huang, Kaiqi},
      year          = {2024},
      eprint        = {2410.02492},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2410.02492}
    }

VLT-MI:
  source: "arXiv:2409.08887 (arXiv API record, v1); abstract from arXiv:2409.08887; BibTeX follows arXiv's own export for the latest version (v1, checked 2026-10-21)"
  abstract: >-
    Visual Language Tracking (VLT) enhances tracking by mitigating the limitations of relying solely
    on the visual modality, utilizing high-level semantic information through language. This
    integration of the language enables more advanced human-machine interaction. The essence of
    interaction is cognitive alignment, which typically requires multiple information exchanges,
    especially in the sequential decision-making process of VLT. However, current VLT benchmarks do
    not account for multi-round interactions during tracking. They provide only an initial text and
    bounding box (bbox) in the first frame, with no further interaction as tracking progresses,
    deviating from the original motivation of the VLT task. To address these limitations, we propose
    a novel and robust benchmark, VLT-MI (Visual Language Tracking with Multi-modal Interaction),
    which introduces multi-round interaction into the VLT task for the first time. (1) We generate
    diverse, multi-granularity texts for multi-round, multi-modal interaction based on existing
    mainstream VLT benchmarks using DTLLM-VLT, leveraging the world knowledge of LLMs. (2) We
    propose a new VLT interaction paradigm that achieves multi-round interaction through text
    updates and object recovery. When multiple tracking failures occur, we provide the tracker with
    more aligned texts and corrected bboxes through interaction, thereby expanding the scope of VLT
    downstream tasks. (3) We conduct comparative experiments on both traditional VLT benchmarks and
    VLT-MI, evaluating and analyzing the accuracy and robustness of trackers under the interactive
    paradigm. This work offers new insights and paradigms for the VLT task, enabling a fine-grained
    evaluation of multi-modal trackers. We believe this approach can be extended to additional
    datasets in the future, supporting broader evaluations and comparisons of video-language model
    capabilities.
  contributions:
    - "Introduces VLT-MI, the first benchmark to bring multi-round interaction into visual language tracking, with diverse multi-granularity texts generated by DTLLM-VLT on mainstream VLT benchmarks."
    - "Proposes an interaction paradigm in which, after tracking failures, the tracker receives better-aligned texts and corrected bounding boxes through text updates and object recovery."
    - "Compares trackers on traditional VLT benchmarks and VLT-MI, assessing their accuracy and robustness under the interactive paradigm."
  bibtex: |-
    @misc{li2024visual,
      title         = {Visual Language Tracking with Multi-modal Interaction: A Robust Benchmark},
      author        = {Li, Xuchen and Hu, Shiyu and Feng, Xiaokun and Zhang, Dailing and Wu, Meiqi and Zhang, Jing and Huang, Kaiqi},
      year          = {2024},
      eprint        = {2409.08887},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2409.08887}
    }

VTT-ICLR:
  source: "OpenReview forum LGbzYw_pnsc (ICLR submission; page blocked by a bot-verification challenge, not checked); BibTeX from the CV bibliography entry hu2023nearing; abstract from the public anonymized submission PDF https://huuuuusy.github.io/files/VTT-ICLR.pdf"
  abstract: >-
    Dynamic visual ability (DVA), a fundamental function of the human visual system, has been
    successfully modeled by many computer vision tasks in recent decades. However, the prosperity
    developments mainly concentrate on using deep neural networks (DNN) to simulate the human DVA
    system, but evaluation frameworks still simply compare performance between machines, making it
    tough to determine how far the gap is between humans and machines in dynamic vision tasks. In
    fact, neglecting this issue not only makes it hard to determine the correctness of current
    research routes, but also cannot truly measure the DVA intelligence of machines. To answer the
    question, this work designs a comprehensive evaluation framework based on the 3E paradigm – we
    carefully pick 87 videos from various dimensions to construct the environment, confirming it can
    cover both perceptual and cognitive components of DVA; select 20 representative machines and 15
    human subjects to form the task executors, ensuring that different model structures can help us
    observe the effectiveness of research development; and propose multiple evaluation indicators to
    quantify their DVA. Based on detailed experimental analyses, we first determine that the current
    algorithm research route has effectively shortened the gap. Besides, we further summarize the
    weaknesses of different executors, and design a human-machine cooperation mechanism with
    superhuman performance. In summary, the contributions include: (1) Quantifying the DVA of humans
    and machines, (2) proposing a new view to evaluate DVA intelligence based on the human-machine
    comparison, and (3) providing a possibility of human-machine cooperation. The 87 sequences with
    frame-level human-machine comparison and cooperation results, the toolbox for recording
    real-time human performance, codes for sustaining various evaluation metrics, and evaluation
    reports for 20 representative models will be open-sourced to help researchers develop
    intelligent research on dynamic vision tasks.
  contributions:
    - "Designs an evaluation framework based on the 3E paradigm, using 87 videos as the environment, 20 representative machines and 15 human subjects as executors, and multiple indicators to quantify dynamic visual ability."
    - "Shows that the current algorithm research route has effectively narrowed the human-machine gap, and summarizes the weaknesses of different executors."
    - "Designs a human-machine cooperation mechanism that reaches superhuman performance."
  bibtex: |-
    @misc{hu2023nearing,
      title        = {Nearing or Surpassing: Overall Evaluation of Human-Machine Dynamic Vision Ability},
      author       = {Hu, Shiyu and Zhao, Xin and Wang, Yipei and Shan, Yanhu and Huang, Kaiqi},
      howpublished = {OpenReview},
      note         = {\url{https://openreview.net/forum?id=LGbzYw_pnsc}},
      year         = {2023}
    }

SOEI-AAAIW:
  source: "AAAI 2026 AI4Edu workshop is non-archival (ai4ed.cc/workshops/aaai2026; title listed in Oral Session A, no paper page), so BibTeX built from the homepage/CV record; abstract from the arXiv version arXiv:2410.15701 (titled \"When LLMs Learn to be Students: The SOEI Framework for Modeling and Evaluating Virtual Student Agents in Educational Interaction\", same seven authors)"
  abstract: >-
    Recent advances in large language models (LLMs) have enabled intelligent tutoring systems, yet
    the development of LLM-based Virtual Student Agents (LVSAs) remains underexplored. Such agents
    are essential for teacher-facing applications, where simulating diverse learner traits can
    support adaptive instruction and pedagogical skill development. However, current methods lack
    principled personality modeling, scalable evaluation of behavioral consistency, and empirical
    validation in interactive teaching settings. We propose the SOEI framework, a structured
    pipeline comprising Scene, Object, Evaluation, and Interaction, for constructing and evaluating
    personality-aligned LVSAs in classroom scenarios. Leveraging Chinese language instruction as a
    cognitively and emotionally rich testbed, we generate five LVSAs based on Big Five traits
    through LoRA fine-tuning and expert-informed prompt design. Their behavioral realism and
    personality coherence are assessed using a hybrid human & GPT-4 evaluation and a
    multi-dimensional annotation protocol. Through controlled experiments with real pre-service
    teachers, we demonstrate that LVSAs can elicit adaptive teaching strategies and maintain
    trait-consistent behavior across multi-turn dialogues. Our results provide: (1) an educationally
    and psychologically grounded generation pipeline for LLM-based student agents; (2) a hybrid,
    scalable evaluation framework for behavioral realism; and (3) empirical insights into the
    pedagogical utility of LVSAs in shaping instructional adaptation. By embedding LVSAs into both
    generative modeling and human-in-the-loop teaching, SOEI bridges AI for Education (AI4Edu) and
    Education for AI (Edu4AI), positioning classroom interaction as a rigorous testbed for
    controllability, personality alignment, and human-likeness in large language models.
  contributions:
    - "Proposes SOEI, a structured Scene-Object-Evaluation-Interaction pipeline for building and evaluating personality-aligned LLM-based virtual student agents in classroom scenarios."
    - "Builds five virtual student agents based on Big Five traits for Chinese language instruction, using LoRA fine-tuning and expert-informed prompt design."
    - "Evaluates behavioral realism and personality coherence with hybrid human and GPT-4 assessment, and shows in experiments with pre-service teachers that the agents elicit adaptive teaching strategies."
  bibtex: |-
    @inproceedings{ma2026learning,
      title     = {Learning to Be Taught: A Structured {SOEI} Framework for Modeling and Evaluating Personality-Aligned Virtual Student Agents},
      author    = {Ma, Yiping and Hu, Shiyu and Li, Xuchen and Wang, Yipei and Chen, Yuqing and Liu, Shiqing and Cheong, Kang Hao},
      booktitle = {AI for Education Workshop at the 40th {AAAI} Conference on Artificial Intelligence},
      year      = {2026},
      note      = {Non-archival; arXiv version: arXiv:2410.15701}
    }

EduVerse-AAAIW:
  source: "AAAI 2026 AI4Edu workshop is non-archival (ai4ed.cc/workshops/aaai2026; title listed in Oral Session C, no paper page), so BibTeX built from the homepage/CV record; abstract from the arXiv version arXiv:2510.05650 (titled \"EduVerse: A User-Defined Multi-Agent Simulation Space for Education Scenario\")"
  abstract: >-
    Reproducing cognitive development, group interaction, and long-term evolution in virtual
    classrooms remains a core challenge for educational AI, as real classrooms integrate open-ended
    cognition, dynamic social interaction, affective factors, and multi-session development rarely
    captured together. Existing approaches mostly focus on short-term or single-agent settings,
    limiting systematic study of classroom complexity and cross-task reuse. We present EduVerse, the
    first user-defined multi-agent simulation space that supports environment, agent, and session
    customization. A distinctive human-in-the-loop interface further allows real users to join the
    space. Built on a layered CIE (Cognition-Interaction-Evolution) architecture, EduVerse ensures
    individual consistency, authentic interaction, and longitudinal adaptation in cognition,
    emotion, and behavior-reproducing realistic classroom dynamics with seamless human-agent
    integration. We validate EduVerse in middle-school Chinese classes across three text genres,
    environments, and multiple sessions. Results show: (1) Instructional alignment: simulated IRF
    rates (0.28-0.64) closely match real classrooms (0.37-0.49), indicating pedagogical realism; (2)
    Group interaction and role differentiation: network density (0.27-0.40) with about one-third of
    peer links realized, while human-agent tasks indicate a balance between individual variability
    and instructional stability; (3) Cross-session evolution: the positive transition rate R+
    increase by 11.7% on average, capturing longitudinal shifts in behavior, emotion, and cognition
    and revealing structured learning trajectories. Overall, EduVerse balances realism,
    reproducibility, and interpretability, providing a scalable platform for educational AI. The
    system will be open-sourced to foster cross-disciplinary research.
  contributions:
    - "Introduces EduVerse, a user-defined multi-agent simulation space for classrooms that supports environment, agent and session customization, plus a human-in-the-loop interface for real users."
    - "Builds a layered Cognition-Interaction-Evolution (CIE) architecture for individual consistency, authentic interaction and longitudinal adaptation in cognition, emotion and behavior."
    - "Validates it in middle-school Chinese classes, with simulated IRF rates (0.28-0.64) close to real classrooms (0.37-0.49) and an average 11.7% rise in the positive transition rate across sessions."
  bibtex: |-
    @inproceedings{ma2026redefining,
      title     = {Redefining Educational Simulation: {EduVerse} as a User-Defined and Developmental Multi-Agent Simulation Space},
      author    = {Ma, Yiping and Hu, Shiyu and Zhu, Buyuan and Wang, Yipei and Kang, Yaxuan and Liu, Shiqing and Cheong, Kang Hao},
      booktitle = {AI for Education Workshop at the 40th {AAAI} Conference on Artificial Intelligence},
      year      = {2026},
      note      = {Non-archival; arXiv version: arXiv:2510.05650}
    }

EduPersona-AAAIW:
  source: "AAAI 2026 AI4Edu workshop is non-archival (ai4ed.cc/workshops/aaai2026; title listed in Oral Session B, no paper page), so BibTeX built from the homepage/CV record; abstract from the arXiv version arXiv:2510.04648 (titled \"EduPersona: Benchmarking Subjective Ability Boundaries of Virtual Student Agents\")"
  abstract: >-
    As large language models are increasingly integrated into education, virtual student agents are
    becoming vital for classroom simulation and teacher training. Yet their classroom-oriented
    subjective abilities remain largely unassessed, limiting understanding of model boundaries and
    hindering trustworthy deployment. We present EduPersona, a large-scale benchmark spanning two
    languages, three subjects, and ten persona types based on the Big Five theory. The dataset
    contains 1,308 authentic classroom dialogue rounds, corresponding to 12,814 teacher-student Q&A
    turns, and is further expanded through persona stylization into roughly 10 times larger scale
    (128k turns), providing a solid foundation for evaluation. Building on this resource, we
    decompose hard-to-quantify subjective performance into three progressive tasks: TASK1 basic
    coherence (whether behavior, emotion, expression, and voice align with classroom context), TASK2
    student realism, and TASK3 long-term persona consistency, thereby establishing an evaluation
    framework grounded in educational theory and research value. We conduct systematic experiments
    on three representative LLMs, comparing their original versions with ten persona-fine-tuned
    variants trained on EduPersona. Results show consistent and significant average improvements
    across all tasks: TASK1 +33.6%, TASK2 +30.6%, and TASK3 +14.9%. These improvements highlight the
    dataset's effectiveness and research value, while also revealing the heterogeneous difficulty of
    persona modeling. In summary, EduPersona delivers the first classroom benchmark centered on
    subjective abilities, establishes a decoupled and verifiable research paradigm, and we will
    open-source both the dataset and the framework to support the broader research community in
    advancing trustworthy and human-like AI for education.
  contributions:
    - "Builds a classroom benchmark spanning two languages, three subjects and ten Big Five persona types, with 1,308 dialogue rounds (12,814 Q&A turns) expanded to about 128k turns."
    - "Decomposes subjective ability into three progressive tasks: basic coherence, student realism and long-term persona consistency, grounded in educational theory."
    - "Shows that persona-fine-tuned variants of three LLMs improve on average by 33.6%, 30.6% and 14.9% on the three tasks, while revealing uneven difficulty across personas."
  bibtex: |-
    @inproceedings{zhu2026objective,
      title     = {From Objective to Subjective: A Benchmark for Virtual Student Abilities},
      author    = {Zhu, Buyuan and Hu, Shiyu and Ma, Yiping and Zhang, Yuanming and Cheong, Kang Hao},
      booktitle = {AI for Education Workshop at the 40th {AAAI} Conference on Artificial Intelligence},
      year      = {2026},
      note      = {Non-archival; arXiv version: arXiv:2510.04648}
    }

DTLLM:
  source: "CVF open access BibTeX (CVPR 2024 Workshops, VDU) + DOI 10.1109/CVPRW63382.2024.00724 (Crossref); abstract from arXiv:2405.12139 (same text as the CVF page, whose copy has the commas stripped)"
  abstract: >-
    Visual Language Tracking (VLT) enhances single object tracking (SOT) by integrating natural
    language descriptions from a video, for the precise tracking of a specified object. By
    leveraging high-level semantic information, VLT guides object tracking, alleviating the
    constraints associated with relying on a visual modality. Nevertheless, most VLT benchmarks are
    annotated in a single granularity and lack a coherent semantic framework to provide scientific
    guidance. Moreover, coordinating human annotators for high-quality annotations is laborious and
    time-consuming. To address these challenges, we introduce DTLLM-VLT, which automatically
    generates extensive and multi-granularity text to enhance environmental diversity. (1) DTLLM-VLT
    generates scientific and multi-granularity text descriptions using a cohesive prompt framework.
    Its succinct and highly adaptable design allows seamless integration into various visual
    tracking benchmarks. (2) We select three prominent benchmarks to deploy our approach: short-term
    tracking, long-term tracking, and global instance tracking. We offer four granularity
    combinations for these benchmarks, considering the extent and density of semantic information,
    thereby showcasing the practicality and versatility of DTLLM-VLT. (3) We conduct comparative
    experiments on VLT benchmarks with different text granularities, evaluating and analyzing the
    impact of diverse text on tracking performance. Conclusionally, this work leverages LLM to
    provide multi-granularity semantic information for VLT task from efficient and diverse
    perspectives, enabling fine-grained evaluation of multi-modal trackers. In the future, we
    believe this work can be extended to more datasets to support vision datasets understanding.
  contributions:
    - "Introduces DTLLM-VLT, which uses an LLM with a cohesive prompt framework to automatically generate multi-granularity text descriptions that plug into various visual tracking benchmarks."
    - "Deploys it on three benchmarks covering short-term, long-term and global instance tracking, offering four granularity combinations based on the extent and density of semantic information."
    - "Compares trackers on VLT benchmarks with different text granularities, analyzing how diverse text affects tracking performance."
  bibtex: |-
    @inproceedings{li2024dtllm,
      title     = {{DTLLM-VLT}: Diverse Text Generation for Visual Language Tracking Based on {LLM}},
      author    = {Li, Xuchen and Feng, Xiaokun and Hu, Shiyu and Wu, Meiqi and Zhang, Dailing and Zhang, Jing and Huang, Kaiqi},
      booktitle = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) Workshops},
      pages     = {7283--7292},
      year      = {2024},
      doi       = {10.1109/CVPRW63382.2024.00724}
    }
