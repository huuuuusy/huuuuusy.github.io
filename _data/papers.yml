IET-AI4Edu:
  source: "DOI 10.1142/S2737599425500264 (Crossref/World Scientific; vol. 12, article 2550026); abstract from Crossref (World Scientific deposit)"
  abstract: >-
    Artificial intelligence (AI) in education has triggered significant debates about ethics,
    fairness, and accountability. This article introduces a five-dimensional trust framework to
    evaluate educational AI systems across five key domains: privacy, safety, fairness,
    explainability, and accountability. Through a comparative analysis of four representative
    cases—a virtual teaching assistant, an adaptive learning platform, an algorithmic grading
    system, and an AI-based proctoring tool—we identify recurring trust-related risks and systemic
    governance vulnerabilities, such as insufficient oversight, lack of transparency, and unclear
    accountability mechanisms. The analysis reveals risks such as data breaches, bias, opaque
    decision-making, and ambiguous responsibility. To address these issues, we propose
    multi-stakeholder governance strategies, including ethical-by-design principles, institutional
    oversight, and regulatory standards. This study concludes by outlining major avenues for future
    research, such as developing explainable AI systems tailored to educational settings,
    constructing trust models for human–AI collaboration, and evaluating the enduring impacts of AI
    governance structures.
  contributions:
    - "Introduces a five-dimensional trust framework for evaluating educational AI systems across privacy, safety, fairness, explainability and accountability."
    - "Compares four representative cases, a virtual teaching assistant, an adaptive learning platform, an algorithmic grading system and an AI-based proctoring tool, to identify recurring trust risks and governance vulnerabilities."
    - "Proposes multi-stakeholder governance strategies, including ethical-by-design principles, institutional oversight and regulatory standards, and outlines avenues for future research."
