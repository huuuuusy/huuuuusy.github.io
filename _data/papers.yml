TNSE26:
  source: "DOI 10.1109/TNSE.2026.3668404 (Crossref/IEEE Xplore 11417444; vol. 13, pp. 7667-7683, no issue number in the record); abstract from IEEE Xplore"
  abstract: >-
    Multimodal video intelligence is increasingly shaped not only by algorithmic progress but also
    by the constraints of networked deployment, such as limited compute and communication resources,
    real-time latency, energy, and cost. This survey examines the field from a network and system
    perspective and organizes recent advances into a three-stage, constraint-driven trajectory that
    links algorithmic capabilities with deployment architectures and network behaviors. The first
    stage, Perception Enhancement, focuses on real-time closed-loop processing through lightweight
    models and edge-side control. The second stage, Semantic Understanding, addresses long-sequence
    and multimodal analysis by leveraging edge–cloud collaboration and distributed scheduling. The
    third stage, Cognitive Reasoning, supports causal and interactive intelligence via retrieval
    augmentation, long-term memory, and multi-agent coordination. Across these stages,
    algorithm–system co-design is reflected in network behaviors such as caching, compression,
    representation sharing, and cross-modal alignment. Overall, this survey highlights a shift from
    algorithm-centric design toward network-aware intelligence, from static perception to open-world
    generalization, and from isolated inference to networked interactive systems, providing insights
    for bridging AI research with real-world networked applications.
  contributions:
    - "Surveys multimodal video intelligence from a network and system perspective, framing progress as shaped by deployment constraints such as compute, communication, real-time latency, energy and cost."
    - "Organizes recent advances into a three-stage trajectory, Perception Enhancement, Semantic Understanding and Cognitive Reasoning, linking each stage to deployment architectures and network behaviors."
    - "Analyzes algorithm-system co-design through caching, compression, representation sharing and cross-modal alignment, and highlights the shift toward network-aware, open-world and networked interactive systems."
