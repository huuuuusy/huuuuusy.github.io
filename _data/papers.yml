Mathematics-AGS:
  source: "DOI 10.3390/math13172828 (Crossref/MDPI; vol. 13, no. 17, article 2828); abstract from Crossref (MDPI deposit); first author given name per official record (Le Ying; CV has Leying)"
  abstract: >-
    This paper presents a comprehensive analysis of artificial intelligence-powered automated
    grading systems (AI AGSs) in STEM education, systematically examining their algorithmic
    foundations, mathematical modeling approaches, and quantitative evaluation methodologies. AI
    AGSs enhance grading efficiency by providing large-scale, instant feedback and reducing
    educators’ workloads. Compared to traditional manual grading, these systems improve consistency
    and scalability, supporting a wide range of assessment types, from programming assignments to
    open-ended responses. This paper provides a structured taxonomy of AI techniques including
    logistic regression, decision trees, support vector machines, convolutional neural networks,
    transformers, and generative models, analyzing their mathematical formulations and performance
    characteristics. It further examines critical challenges, such as user trust issues, potential
    biases, and students’ over-reliance on automated feedback, alongside quantitative evaluation
    using precision, recall, F1-score, and Cohen’s Kappa metrics. The analysis includes feature
    engineering strategies for diverse educational data types and prompt engineering methodologies
    for large language models. Lastly, we highlight emerging trends, including explainable AI and
    multimodal assessment systems, offering educators and researchers a mathematical foundation for
    understanding and implementing AI AGSs into educational practices.
  contributions:
    - "Reviews AI-powered automated grading systems in STEM education, examining their algorithmic foundations, mathematical modeling approaches and quantitative evaluation methodologies."
    - "Provides a structured taxonomy of AI techniques, from logistic regression, decision trees and support vector machines to CNNs, transformers and generative models, analyzing their formulations and performance."
    - "Discusses challenges such as user trust, bias and over-reliance on automated feedback, and highlights emerging trends including explainable AI and multimodal assessment systems."
