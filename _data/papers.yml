IGBA:
  source: "Journal site (zxws.cbpt.cnki.net): Chinese Mental Health Journal 2025, 39(4): 337-343, no DOI; official byline has 8 authors in the order Huang, Kang, Yan, Hu, Gao, Wang, Tao, Zeng (homepage/CV list 7, omit Zeng Yangruiyu and order Wang, Tao, Gao); English title from the CV (journal page shows only the Chinese title); official English abstract from the journal page (missing spaces after full stops restored)"
  abstract: >-
    Game-based psychological assessment utilizes game mechanisms and elements to enhance
    participants' motivation and improve measurement accuracy, but similar to traditional methods,
    it mainly focuses on static results. By integrating game-based psychological assessment with
    artificial intelligence technology, this paper proposes the paradigm of intelligent
    psychological assessment based on interactive environment. With analyzing dynamic process data
    within the game, this paradigm can accurately depict the participants' actions and results in
    the interactive context, more effectively representing individual psychological states and
    behavioral characteristics. This new paradigm demonstrates advancements and significant
    potential for development in terms of demand, data collection, and analysis techniques.
  contributions:
