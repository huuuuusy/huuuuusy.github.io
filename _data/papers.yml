      year    = {2026},
      doi     = {10.3390/math14071094}
    }

HLE:
  source: "DOI 10.1038/s41586-025-09962-4 (Crossref/Nature; vol. 649, no. 8099, pp. 1139-1146); author field uses the three organizational authors of the official byline (Center for AI Safety, Scale AI & HLE Contributors Consortium); abstract from nature.com (reference marker removed)"
  abstract: >-
    Benchmarks are important tools for tracking the rapid advancements in large language model (LLM)
    capabilities. However, benchmarks are not keeping pace in difficulty: LLMs now achieve more than
    90% accuracy on popular benchmarks such as Measuring Massive Multitask Language Understanding,
    limiting informed measurement of state-of-the-art LLM capabilities. Here, in response, we
    introduce Humanity’s Last Exam (HLE), a multi-modal benchmark at the frontier of human
    knowledge, designed to be an expert-level closed-ended academic benchmark with broad subject
    coverage. HLE consists of 2,500 questions across dozens of subjects, including mathematics,
    humanities and the natural sciences. HLE is developed globally by subject-matter experts and
    consists of multiple-choice and short-answer questions suitable for automated grading. Each
    question has a known solution that is unambiguous and easily verifiable but cannot be quickly
    answered by internet retrieval. State-of-the-art LLMs demonstrate low accuracy and calibration
    on HLE, highlighting a marked gap between current LLM capabilities and the expert human frontier
    on closed-ended academic questions. To inform research and policymaking upon a clear
    understanding of model capabilities, we publicly release HLE at https://lastexam.ai.
  contributions:
    - "Introduces Humanity's Last Exam (HLE), a multi-modal, expert-level closed-ended academic benchmark of 2,500 questions across dozens of subjects, including mathematics, humanities and the natural sciences."
    - "Builds the benchmark from multiple-choice and short-answer questions written globally by subject-matter experts, each with an unambiguous, verifiable solution that cannot be quickly answered by internet retrieval."
    - "Shows that state-of-the-art LLMs have low accuracy and calibration on HLE, revealing a marked gap to the expert human frontier, and publicly releases the benchmark."
