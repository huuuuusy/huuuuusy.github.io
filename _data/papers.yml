CSTrack:
  source: "PMLR v267 (feng25t) proceedings BibTeX; abstract from PMLR proceedings page"
  abstract: >-
    Effectively modeling and utilizing spatiotemporal features from RGB and other modalities (e.g.,
    depth, thermal, and event data, denoted as X) is the core of RGB-X tracker design. Existing
    methods often employ two parallel branches to separately process the RGB and X input streams,
    requiring the model to simultaneously handle two dispersed feature spaces, which complicates
    both the model structure and computation process. More critically, intra-modality spatial
    modeling within each dispersed space incurs substantial computational overhead, limiting
    resources for inter-modality spatial modeling and temporal modeling. To address this, we propose
    a novel tracker, CSTrack, which focuses on modeling Compact Spatiotemporal features to achieve
    simple yet effective tracking. Specifically, we first introduce an innovative Spatial Compact
    Module that integrates the RGB-X dual input streams into a compact spatial feature, enabling
    thorough intra- and inter-modality spatial modeling. Additionally, we design an efficient
    Temporal Compact Module that compactly represents temporal features by constructing the refined
    target distribution heatmap. Extensive experiments validate the effectiveness of our compact
    spatiotemporal modeling method, with CSTrack achieving new SOTA results on mainstream RGB-X
    benchmarks. The code and models will be released at: https://github.com/XiaokunFeng/CSTrack.
  contributions:
    - "Proposes CSTrack, an RGB-X tracker that models compact spatiotemporal features rather than processing RGB and X inputs in two parallel branches with dispersed feature spaces."
    - "Introduces a Spatial Compact Module that integrates the RGB-X dual input streams into one compact spatial feature, enabling thorough intra- and inter-modality spatial modeling."
    - "Designs a Temporal Compact Module that represents temporal features via a refined target distribution heatmap, with CSTrack achieving new state-of-the-art results on mainstream RGB-X benchmarks."
  bibtex: |-
    @inproceedings{feng2025cstrack,
      title     = {{CSTrack}: Enhancing {RGB-X} Tracking via Compact Spatiotemporal Features},
      author    = {Feng, Xiaokun and Zhang, Dailing and Hu, Shiyu and Li, Xuchen and Wu, Meiqi and Zhang, Jing and Chen, Xiaotang and Huang, Kaiqi},
