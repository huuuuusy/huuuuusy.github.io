CPDTrack:
  source: "DOI 10.52202/079017-0086; BibTeX from NeurIPS 2024 proceedings (.bib), checked against CV; abstract from the NeurIPS proceedings page (hyphenation artefacts 'pro- pose', 'high- quality' fixed)"
  abstract: >-
    Human visual search ability enables efficient and accurate tracking of an arbitrary moving
    target, which is a significant research interest in cognitive neuroscience. The recently
    proposed Central-Peripheral Dichotomy (CPD) theory sheds light on how humans effectively process
    visual information and track moving targets in complex environments. However, existing visual
    object tracking algorithms still fall short of matching human performance in maintaining
    tracking over time, particularly in complex scenarios requiring robust visual search skills.
    These scenarios often involve Spatio-Temporal Discontinuities (i.e., STDChallenge), prevalent in
    long-term tracking and global instance tracking. To address this issue, we conduct research from
    a human-like modeling perspective: (1) Inspired by the CPD, we propose a new tracker named
    CPDTrack to achieve human-like visual search ability. The central vision of CPDTrack leverages
    the spatio-temporal continuity of videos to introduce priors and enhance localization precision,
    while the peripheral vision improves global awareness and detects object movements. (2) To
    further evaluate and analyze STDChallenge, we create the STDChallenge Benchmark. Besides, by
    incorporating human subjects, we establish a human baseline, creating a high-quality environment
    specifically designed to assess trackers’ visual search abilities in videos across STDChallenge.
    (3) Our extensive experiments demonstrate that the proposed CPDTrack not only achieves
    state-of-the-art (SOTA) performance in this challenge but also narrows the behavioral
    differences with humans. Additionally, CPDTrack exhibits strong generalizability across various
    challenging benchmarks. In summary, our research underscores the importance of human-like
    modeling and offers strategic insights for advancing intelligent visual target tracking. Code
    and models are available at https://github.com/ZhangDailing8/CPDTrack.
  contributions:
    - "Proposes CPDTrack, a tracker inspired by Central-Peripheral Dichotomy theory, whose central vision exploits spatio-temporal continuity for precise localization and whose peripheral vision improves global awareness."
    - "Builds the STDChallenge Benchmark for tracking under spatio-temporal discontinuities and establishes a human baseline with human subjects to assess trackers' visual search abilities."
    - "Shows that CPDTrack achieves state-of-the-art performance on STDChallenge, narrows behavioral differences with humans, and generalizes across various challenging benchmarks."
  bibtex: |-
    @inproceedings{zhang2024beyond,
      title     = {Beyond Accuracy: Tracking more like Human via Visual Search},
      author    = {Zhang, Dailing and Hu, Shiyu and Feng, Xiaokun and Li, Xuchen and Wu, Meiqi and Zhang, Jing and Huang, Kaiqi},
      booktitle = {Advances in Neural Information Processing Systems},
      volume    = {37},
      pages     = {2629--2662},
      year      = {2024},
      doi       = {10.52202/079017-0086}
    }

MemVLT:
  source: "DOI 10.52202/079017-0476; BibTeX from NeurIPS 2024 proceedings (.bib), checked against CV; abstract from the NeurIPS proceedings page (LaSOT$_{ext}$ rendered as LaSOT_ext)"
  abstract: >-
    Vision-language tracking (VLT) enhances traditional visual object tracking by integrating
    language descriptions, requiring the tracker to flexibly understand complex and diverse text in
    addition to visual information. However, most existing vision-language trackers still overly
    rely on initial fixed multimodal prompts, which struggle to provide effective guidance for
    dynamically changing targets. Fortunately, the Complementary Learning Systems (CLS) theory
    suggests that the human memory system can dynamically store and utilize multimodal perceptual
    information, thereby adapting to new scenarios. Inspired by this, (i) we propose a Memory-based
    Vision-Language Tracker (MemVLT). By incorporating memory modeling to adjust static prompts, our
    approach can provide adaptive prompts for tracking guidance. (ii) Specifically, the memory
    storage and memory interaction modules are designed in accordance with CLS theory. These modules
    facilitate the storage and flexible interaction between short-term and long-term memories,
    generating prompts that adapt to target variations. (iii) Finally, we conduct extensive
    experiments on mainstream VLT datasets (e.g., MGIT, TNL2K, LaSOT and LaSOT_ext). Experimental
    results show that MemVLT achieves new state-of-the-art performance. Impressively, it achieves
    69.4% AUC on the MGIT and 63.3% AUC on the TNL2K, improving the existing best result by 8.4% and
    4.7%, respectively.
  contributions:
    - "Proposes MemVLT, a memory-based vision-language tracker that uses memory modeling to adjust static multimodal prompts into adaptive prompts for tracking guidance."
    - "Designs memory storage and memory interaction modules following Complementary Learning Systems theory, letting short-term and long-term memories interact to generate prompts that adapt to target variations."
    - "Achieves new state-of-the-art results on mainstream VLT datasets, including 69.4% AUC on MGIT and 63.3% AUC on TNL2K, improving the previous best by 8.4% and 4.7%."
  bibtex: |-
    @inproceedings{feng2024memvlt,
      title     = {{MemVLT}: Vision-Language Tracking with Adaptive Memory-based Prompts},
      author    = {Feng, Xiaokun and Li, Xuchen and Hu, Shiyu and Zhang, Dailing and Wu, Meiqi and Zhang, Jing and Chen, Xiaotang and Huang, Kaiqi},
      booktitle = {Advances in Neural Information Processing Systems},
      volume    = {37},
      pages     = {14903--14933},
      year      = {2024},
      doi       = {10.52202/079017-0476}
    }

ICASSP24:
  source: "DOI 10.1109/ICASSP48485.2024.10447135 (Crossref; title case 'Cryo-Em' and author 'Hu, ShiYu' in the record normalised to Cryo-EM / Hu, Shiyu); abstract from arXiv:2401.01097 (identical to the IEEE record, which has the artefact 'nearatomic')"
  abstract: >-
    Cryo-electron microscopy (cryo-EM) has achieved near-atomic level resolution of biomolecules by
    reconstructing 2D micrographs. However, the resolution and accuracy of the reconstructed
    particles are significantly reduced due to the extremely low signal-to-noise ratio (SNR) and
    complex noise structure of cryo-EM images. In this paper, we introduce a diffusion model with
    post-processing framework to effectively denoise and restore single particle cryo-EM images. Our
    method outperforms the state-of-the-art (SOTA) denoising methods by effectively removing
    structural noise that has not been addressed before. Additionally, more accurate and
    high-resolution three-dimensional reconstruction structures can be obtained from denoised
    cryo-EM images.
  contributions:
    - "Introduces a diffusion model with a post-processing framework to denoise and restore single-particle cryo-EM images, which suffer from extremely low signal-to-noise ratio and complex noise structure."
    - "Shows that the method outperforms state-of-the-art denoising methods by removing structural noise that had not been addressed before."
    - "Shows that denoised cryo-EM images yield more accurate, higher-resolution three-dimensional reconstruction structures."
  bibtex: |-
    @inproceedings{zhang2024robust,
      title     = {Robust Single-Particle {Cryo-EM} Image Denoising and Restoration},
      author    = {Zhang, Jing and Zhao, Tengfei and Hu, Shiyu and Zhao, Xin},
      booktitle = {IEEE International Conference on Acoustics, Speech and Signal Processing (ICASSP)},
      pages     = {2995--2999},
      year      = {2024},
      doi       = {10.1109/ICASSP48485.2024.10447135}
