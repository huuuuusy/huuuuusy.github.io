      title   = {Trustworthy {AI} in education: Framework, cases, and governance strategies},
      author  = {Ma, Yiping and Li, Xinjin and Hu, Shiyu and Liu, Shiqing and Cheong, Kang Hao},
      journal = {Innovation and Emerging Technologies},
      volume  = {12},
