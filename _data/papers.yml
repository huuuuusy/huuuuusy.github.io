AWCV:
  source: "DOI 10.1109/TCSVT.2024.3385851 (Crossref, doi.org); abstract from the published IEEE version (IEEE record via OpenAlex, identical to the accepted version at files/AWCV100k.pdf; the later arXiv:2412.19537 names the dataset AWCV-100K-UCAS2024)"
  abstract: >-
    Air-writing is a challenging task that combines the fields of computer vision and natural
    language processing, offering an intuitive and natural approach for human-computer interaction.
    However, current air-writing solutions face two primary challenges: (1) their dependency on
    complex sensors (e.g., Radar, EEGs and others) for capturing precise handwritten trajectories,
    and (2) the absence of a video-based air-writing dataset that covers a comprehensive vocabulary
    range. These limitations impede their practicality in various real-world scenarios, including
    the use on devices like iPhones and laptops. To tackle these challenges, we present the
    groundbreaking air-writing Chinese character video dataset (AWCV-100K), serving as a pioneering
    benchmark for video-based air-writing. This dataset captures handwritten trajectories in various
    real-world scenarios using commonly accessible RGB cameras, eliminating the need for complex
    sensors. AWCV-100K includes 8.8 million video frames, encompassing the complete set of 3,755
    characters from the GB2312-80 level-1 set (GB1). Furthermore, we introduce our baseline
    approach, the video-based character recognizer (VCRec). VCRec adeptly extracts fingertip
    features from sparse visual cues and employs a spatio-temporal sequence module for analysis.
    Experimental results showcase the superior performance of VCRec compared to existing models in
    recognizing air-written characters, both quantitatively and qualitatively. This breakthrough
    paves the way for enhanced human-computer interaction in real-world contexts. Moreover, our
    approach leverages affordable RGB cameras, enabling its applicability in a diverse range of
    scenarios. The code and data examples will be made public at https://github.com/wmeiqi/AWCV.
  contributions:
    - "Builds AWCV-100K, a video-based air-writing Chinese character dataset captured with ordinary RGB cameras, with 8.8 million frames covering all 3,755 GB2312-80 level-1 characters."
    - "Introduces VCRec, a baseline video-based character recognizer that extracts fingertip features from sparse visual cues and analyzes them with a spatio-temporal sequence module."
    - "Shows that VCRec outperforms existing models in recognizing air-written characters, quantitatively and qualitatively, without relying on complex sensors."
  bibtex: |-
    @article{wu2024finger,
      title   = {Finger in Camera Speaks Everything: Unconstrained Air-Writing for Real-World},
      author  = {Wu, Meiqi and Huang, Kaiqi and Cai, Yuanqiang and Hu, Shiyu and Zhao, Yuzhong and Wang, Weiqiang},
      journal = {IEEE Transactions on Circuits and Systems for Video Technology},
      volume  = {34},
      number  = {9},
      pages   = {8602--8613},
      year    = {2024},
      doi     = {10.1109/TCSVT.2024.3385851}
    }

VSLLM:
  source: "DOI 10.1007/978-981-97-8692-3_17 (Crossref, doi.org; PRCV 2024 Part IX = LNCS 15039); abstract from arXiv:2508.05299"
  abstract: >-
    The Drawing Projection Test (DPT) is an essential tool in art therapy, allowing psychologists to
    assess participants' mental states through their sketches. Specifically, through sketches with
    the theme of "a person picking an apple from a tree (PPAT)", it can be revealed whether the
    participants are in mental states such as depression. Compared with scales, the DPT can enrich
    psychologists' understanding of an individual's mental state. However, the interpretation of the
    PPAT is laborious and depends on the experience of the psychologists. To address this issue, we
    propose an effective identification method to support psychologists in conducting a large-scale
    automatic DPT. Unlike traditional sketch recognition, DPT more focus on the overall evaluation
    of the sketches, such as color usage and space utilization. Moreover, PPAT imposes a time limit
    and prohibits verbal reminders, resulting in low drawing accuracy and a lack of detailed
    depiction. To address these challenges, we propose the following efforts: (1) Providing an
    experimental environment for automated analysis of PPAT sketches for depression assessment; (2)
    Offering a Visual-Semantic depression assessment based on LLM (VS-LLM) method; (3) Experimental
    results demonstrate that our method improves by 17.6% compared to the psychologist assessment
    method. We anticipate that this work will contribute to the research in mental state assessment
    based on PPAT sketches' elements recognition. Our datasets and codes are available at
    https://github.com/wmeiqi/VS-LLM.
  contributions:
    - "Provides an experimental environment for automated analysis of PPAT (a person picking an apple from a tree) sketches for depression assessment in the Drawing Projection Test."
    - "Proposes VS-LLM, a visual-semantic depression assessment method based on large language models, to support psychologists in large-scale automatic Drawing Projection Tests."
    - "Shows that the method improves by 17.6% over the psychologist assessment method, and releases datasets and code."
  bibtex: |-
    @inproceedings{wu2024vsllm,
      title     = {{VS-LLM}: Visual-Semantic Depression Assessment Based on {LLM} for Drawing Projection Test},
      author    = {Wu, Meiqi and Kang, Yaxuan and Li, Xuchen and Hu, Shiyu and Chen, Xiaotang and Kang, Yunfeng and Wang, Weiqiang and Huang, Kaiqi},
      booktitle = {Pattern Recognition and Computer Vision (PRCV 2024)},
      series    = {Lecture Notes in Computer Science},
      volume    = {15039},
      pages     = {232--246},
      year      = {2024},
      doi       = {10.1007/978-981-97-8692-3_17}
    }

PRCV23:
  source: "DOI 10.1007/978-981-99-8462-6_20 (Crossref, doi.org; PRCV 2023 Part IV = LNCS 14428); abstract from the published chapter (files/PRCV23.pdf, Springer page blocks automated access; one stray space before a comma removed)"
  abstract: >-
    Sandplay therapy functions as a pivotal tool for psychological projection, where testers
    construct a scene to mirror their inner world while psychoanalysts scrutinize the testers’
    psychological state. In this process, recognizing the theme (i.e., identifying the content and
    emotional tone) of a sandplay image is a vital step in facilitating higher-level analysis.
    Unlike traditional visual recognition that focuses solely on the basic information (e.g.,
    category, location, shape, etc.), sandplay theme recognition needs to consider the overall
    content of the image, then relies on a hierarchical knowledge structure to complete the
    reasoning process. Nevertheless, the research of sandplay theme recognition is hindered by
    following challenges: (1) Gathering high-quality and enough sandplay images paired with expert
    analyses to form a scientific dataset is challenging, due to this task relies on a specialized
    sandplay environment. (2) Theme is a comprehensive and high-level information, making it
    difficult to adopt existing works directly in this task. In summary, we have tackled the above
    challenges from the following aspects: (1) Based on carefully analysis of the challenges (e.g.,
    small-scale dataset and complex information), we present the HIST (HIerarchical Sandplay Theme
    recognition) model that incorporates external knowledge to emulate the psychoanalysts’ reasoning
    process. (2) Taking the split theme (a representative and evenly distributed theme) as an
    example, we proposed a high-quality dataset called SP2 (SandPlay SPlit) to evaluate our proposed
    method. Experimental results demonstrate the superior performance of our algorithm compared to
    other baselines, and ablation experiments confirm the importance of incorporating external
    knowledge. We anticipate this work will contribute to the research in sandplay theme
    recognition. The relevant datasets and codes will be released continuously.
  contributions:
    - "Proposes HIST (HIerarchical Sandplay Theme recognition), a model that incorporates external knowledge to emulate psychoanalysts' reasoning when recognizing the theme of a sandplay image."
    - "Builds SP2 (SandPlay SPlit), a high-quality dataset built around the split theme, to evaluate sandplay theme recognition."
    - "Shows that HIST outperforms other baselines, with ablation experiments confirming the importance of incorporating external knowledge."
  bibtex: |-
    @inproceedings{feng2023hierarchical,
      title     = {A Hierarchical Theme Recognition Model for Sandplay Therapy},
      author    = {Feng, Xiaokun and Hu, Shiyu and Chen, Xiaotang and Huang, Kaiqi},
      booktitle = {Pattern Recognition and Computer Vision (PRCV 2023)},
      series    = {Lecture Notes in Computer Science},
      volume    = {14428},
      pages     = {241--252},
      year      = {2023},
      doi       = {10.1007/978-981-99-8462-6_20}
    }

CSAI23:
  source: "DOI 10.1145/3638584.3638644 (Crossref, doi.org); abstract from the ACM record (via OpenAlex), identical to the published PDF"
  abstract: >-
    Similar object interference (SOI) problem challenges the single object tracking (SOT) task,
    leading to the failure of feature-based trackers and subsequent performance degradation.
    Unfortunately, current generic SOT benchmarks do not effectively tackle this critical challenge,
    while popular SOT algorithms consistently underestimate the influence they have on tracking
    performance. To bridge this gap and further enhance the investigation of similar object
    interference in SOT, we adopt the following viewpoints: (1) By examining the operational
    principles of mainstream trackers and their performance on representative SOT datasets, we
    redefine similar objects, taking into account the cognitive bias that exists between trackers
    and humans when dealing with this challenge. (2) Subsequently, we develop a mining methodology
    that enables the extraction of the SOI sub-dataset from SOT datasets without relying on human
    intervention. This methodology comprises two main components: determining the SOI challenge and
    screening the SOI sequences. The SOI dataset is acquired from representative SOT dataset using
    our proposed approach, known as SOI2023. This dataset serves as an ideal environment to
    facilitate the investigation of challenges related to similar object interference. (3)
    Additionally, we conduct extensive tracking experiments with 20 typical trackers and their
    variants on SOI2023 and analyze their performance for similar object interference scenes in
    several dimensions. The experimental results demonstrate the effectiveness of our proposed
    mining method, while revealing the strengths and weaknesses of current trackers when faced with
    the challenge of similar object interference. We hope this work can provide inspiration to the
    tracking community and also provide support and insights for robust tracking under the SOI
    challenge.
  contributions:
    - "Redefines similar objects in single object tracking by examining how mainstream trackers work and perform, accounting for the cognitive bias between trackers and humans."
    - "Develops a mining method that extracts similar object interference (SOI) sub-datasets from SOT datasets without human intervention, producing the SOI2023 dataset."
    - "Evaluates 20 typical trackers and their variants on SOI2023, revealing their strengths and weaknesses under similar object interference."
  bibtex: |-
    @inproceedings{wang2023rethinking,
      title     = {Rethinking Similar Object Interference in Single Object Tracking},
      author    = {Wang, Yipei and Hu, Shiyu and Zhao, Xin},
      booktitle = {Proceedings of the 2023 7th International Conference on Computer Science and Artificial Intelligence (CSAI)},
      pages     = {251--258},
      year      = {2023},
      publisher = {ACM},
      doi       = {10.1145/3638584.3638644}
    }

Neu22:
  source: "DOI 10.1016/j.neucom.2022.06.027 (Crossref, doi.org); abstract from the published Elsevier article (files/Neu22.pdf; ScienceDirect blocks automated access)"
  abstract: >-
    Instance search aims at retrieving a particular object instance from a set of scene images.
    Although studied in previous competitions like TRECVID, there have been limited literature or
    datasets on this topic. In this paper, to overcome the generalization issue when arbitrary
    categories are involved in search and to benefit from the large amount of unlabeled data, we
    propose a cycle self-training framework which trains the instance search pipeline with automatic
    supervision. Given the two-stage pipeline with a localization and ranking module, the cycle
    self-training includes a ranker-guided localizer, and a localizer-guided ranker, each carefully
    designed to handle noisy labels that come with self-supervision. Furthermore, we build and
    release large-scale groundtruth annotations for instances to facilitate the algorithm evaluation
    and analysis in this research topic, especially for small objects in complex background. The
    datasets are publicly available at https://github.com/instance-search/instance-search. Extensive
    experiments show the effectiveness of the proposed cycle self-training framework and the
    superior performance compared with other state-of-the-art methods.
  contributions:
    - "Proposes a cycle self-training framework that trains a two-stage instance search pipeline with automatic supervision, pairing a ranker-guided localizer and a localizer-guided ranker designed for noisy labels."
    - "Builds and releases large-scale ground-truth instance annotations for evaluating instance search, especially for small objects in complex backgrounds."
    - "Shows the effectiveness of the framework and its superior performance over other state-of-the-art methods in extensive experiments."
  bibtex: |-
    @article{zhang2022revisiting,
      title   = {Revisiting Instance Search: A New Benchmark Using Cycle Self-Training},
      author  = {Zhang, Yuqi and Liu, Chong and Chen, Weihua and Xu, Xianzhe and Wang, Fan and Li, Hao and Hu, Shiyu and Zhao, Xin},
      journal = {Neurocomputing},
      volume  = {501},
      pages   = {270--284},
      year    = {2022},
      doi     = {10.1016/j.neucom.2022.06.027}
    }

VTT:
  source: "DOI 10.11996/JG.j.2095-302X.2021030339 (journal site txxb.com.cn; not in Crossref, doi.org content negotiation unavailable); official English abstract from the journal's English page"
  abstract: >-
    Computer vision has gained wide attention in the research of artificial intelligence. After
    nearly 60 years of its development, great achievement has been made in aspect of algorithms,
    technologies, and applications. Over the past decade, deep learning, which is on the basis of
    big data and huge computation power, has further ushered computer vision in an era of large
    model. However, there remains a huge gap between algorithm adaptability and human beings. From
    the perspective of visual task evaluation (in terms of datasets, metrics, and methods), this
    paper summarized the development history of computer vision. In addition, a systematic analysis
    was conducted on the existing problems and obstacles for the development of computer vision
    heavily dependent on big data learning. Based on the analysis, this paper argued that the visual
    Turing test could be the next research direction of computer vision. Finally, the development of
    the visual Turing test and its potential research were discussed.
  contributions:
    - "Reviews the development of computer vision from the perspective of visual task evaluation, covering datasets, metrics, and evaluation methods."
    - "Analyzes the existing problems and obstacles facing computer vision that depends heavily on big-data learning."
    - "Argues, from the view of human-computer gaming, that the visual Turing test could be the next research direction of computer vision, and discusses its potential research."
  bibtex: |-
    @article{huang2021visual,
      title   = {Visual {Turing}: The Next Development of Computer Vision in the View of Human-Computer Gaming},
      author  = {Huang, Kaiqi and Zhao, Xin and Li, Qiaozhe and Hu, Shiyu},
      journal = {Journal of Graphics},
      volume  = {42},
      number  = {3},
      pages   = {339--348},
      year    = {2021},
      doi     = {10.11996/JG.j.2095-302X.2021030339}
    }

Streaming-Video-Survey:
  source: "DOI 10.2139/ssrn.7008298 (Crossref posted-content record; SSRN page blocks automated access); abstract from the Crossref/SSRN record"
  abstract: >-
    Video understanding research often assumes that a video is available before inference, or can at
    least be revisited and re-encoded. Streaming video understanding breaks this assumption: a
    system must update its state from past and current observations while the video is still
    unfolding, deciding how to respond, what evidence to preserve, and how to allocate computation.
    It is therefore not simply long-video understanding with lower latency, but a multimodal
    pattern-recognition problem shaped by causal access, bounded state, and real-time interaction.
    This survey reviews this rapidly developing area through three coupled questions: How to
    Respond, How to Memorize, and How to be Fast. We first clarify the boundaries among streaming,
    online, long-video, and offline video understanding, and then organize existing approaches into
    proactive response timing, long-term memory management, and real-time inference optimization. We
    further analyze how these designs affect evidence sufficiency, memory faithfulness, latency, and
    deployment feasibility, and revisit benchmarks from the perspectives of response timing,
    evidence preservation, interaction quality, and system cost. Finally, we summarize future
    directions including evidence-grounded streaming reasoning, verifiable bounded memory, omnimodal
    interaction, streaming agents, and deployment-aware system co-design. The goal is to position
    streaming video understanding as a causal and resource-constrained pattern-recognition problem
    rather than an online variant of offline video analysis.
  contributions:
    - "Reviews streaming video understanding through three coupled questions: how to respond, how to memorize, and how to be fast."
    - "Clarifies the boundaries among streaming, online, long-video and offline video understanding, and organizes methods into proactive response timing, long-term memory management and real-time inference optimization."
    - "Analyzes how these designs affect evidence sufficiency, memory faithfulness, latency and deployment, revisits benchmarks, and outlines future directions such as evidence-grounded streaming reasoning and streaming agents."
  bibtex: |-
    @misc{li2026respond,
      title        = {How to Respond, How to Memorize, How to be Fast: A Survey of Streaming Video Understanding},
      author       = {Li, Xuchen and Hu, Shiyu and Feng, Xiaokun and Zhao, Jian and Huang, Kaiqi},
      howpublished = {SSRN},
      year         = {2026},
      doi          = {10.2139/ssrn.7008298},
      note         = {https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7008298}
    }

FIOVA:
  source: "arXiv:2410.15270 (v2, 2025-05-19; arXiv metadata); abstract from arXiv:2410.15270; BibTeX follows arXiv's own export for the latest version (v2, checked 2026-10-21)"
  abstract: >-
    Despite rapid progress in large vision-language models (LVLMs), existing video caption
    benchmarks remain limited in evaluating their alignment with human understanding. Most rely on a
    single annotation per video and lexical similarity-based metrics, failing to capture the
    variability in human perception and the cognitive importance of events. These limitations hinder
    accurate diagnosis of model capabilities in producing coherent, complete, and human-aligned
    descriptions. To address this, we introduce FIOVA (Five-In-One Video Annotations), a
    human-centric benchmark tailored for evaluation. It comprises 3,002 real-world videos (about
    33.6s each), each annotated independently by five annotators. This design enables modeling of
    semantic diversity and inter-subjective agreement, offering a richer foundation for measuring
    human-machine alignment. We further propose FIOVA-DQ, an event-level evaluation metric that
    incorporates cognitive weights derived from annotator consensus, providing fine-grained
    assessment of event relevance and semantic coverage. Leveraging FIOVA, we conduct a
    comprehensive evaluation of nine representative LVLMs and introduce a complexity-aware analysis
    framework based on inter-annotator variation (CV). This reveals consistency gaps across
    difficulty levels and identifies structural issues such as event under-description and template
    convergence. Our results highlight FIOVA's diagnostic value for understanding LVLM behavior
    under varying complexity, setting a new standard for cognitively aligned evaluation in
    long-video captioning. The benchmark, annotations, metric, and model outputs are publicly
    released to support future evaluation-driven research in video understanding. More detailed
    information can be found at https://huuuuusy.github.io/fiova/.
  contributions:
    - "Introduces FIOVA, a benchmark of 3,002 real-world videos (about 33.6s each), each annotated independently by five annotators to capture semantic diversity and inter-subjective agreement."
    - "Proposes FIOVA-DQ, an event-level evaluation metric with cognitive weights derived from annotator consensus for fine-grained assessment of event relevance and semantic coverage."
    - "Evaluates nine representative LVLMs with a complexity-aware analysis based on inter-annotator variation, revealing consistency gaps and issues such as event under-description and template convergence."
  bibtex: |-
    @misc{hu2025fiova,
      title         = {{FIOVA}: A Multi-Annotator Benchmark for Human-Aligned Video Captioning},
      author        = {Hu, Shiyu and Li, Xuchen and Li, Xuzhao and Zhang, Jing and Wang, Yipei and Zhao, Xin and Cheong, Kang Hao},
      year          = {2025},
      eprint        = {2410.15270},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2410.15270}
    }

SOEI:
  source: "arXiv:2410.15701 (v2, 2025-05-22; arXiv metadata); abstract from arXiv:2410.15701; BibTeX follows arXiv's own export for the latest version (v2, checked 2026-10-21)"
  abstract: >-
    Recent advances in large language models (LLMs) have enabled intelligent tutoring systems, yet
    the development of LLM-based Virtual Student Agents (LVSAs) remains underexplored. Such agents
    are essential for teacher-facing applications, where simulating diverse learner traits can
    support adaptive instruction and pedagogical skill development. However, current methods lack
    principled personality modeling, scalable evaluation of behavioral consistency, and empirical
    validation in interactive teaching settings. We propose the SOEI framework, a structured
    pipeline comprising Scene, Object, Evaluation, and Interaction, for constructing and evaluating
    personality-aligned LVSAs in classroom scenarios. Leveraging Chinese language instruction as a
    cognitively and emotionally rich testbed, we generate five LVSAs based on Big Five traits
    through LoRA fine-tuning and expert-informed prompt design. Their behavioral realism and
    personality coherence are assessed using a hybrid human & GPT-4 evaluation and a
    multi-dimensional annotation protocol. Through controlled experiments with real pre-service
    teachers, we demonstrate that LVSAs can elicit adaptive teaching strategies and maintain
    trait-consistent behavior across multi-turn dialogues. Our results provide: (1) an educationally
    and psychologically grounded generation pipeline for LLM-based student agents; (2) a hybrid,
    scalable evaluation framework for behavioral realism; and (3) empirical insights into the
    pedagogical utility of LVSAs in shaping instructional adaptation. By embedding LVSAs into both
    generative modeling and human-in-the-loop teaching, SOEI bridges AI for Education (AI4Edu) and
    Education for AI (Edu4AI), positioning classroom interaction as a rigorous testbed for
    controllability, personality alignment, and human-likeness in large language models.
  contributions:
    - "Proposes SOEI, a structured Scene, Object, Evaluation and Interaction pipeline for constructing and evaluating personality-aligned LLM-based virtual student agents (LVSAs) in classroom scenarios."
    - "Builds five LVSAs based on Big Five traits for Chinese language instruction via LoRA fine-tuning and expert-informed prompts, assessed with hybrid human and GPT-4 evaluation."
    - "Shows in controlled experiments with real pre-service teachers that LVSAs elicit adaptive teaching strategies and keep trait-consistent behavior across multi-turn dialogues."
  bibtex: |-
    @misc{ma2025llms,
      title         = {When {LLMs} Learn to be Students: The {SOEI} Framework for Modeling and Evaluating Virtual Student Agents in Educational Interaction},
      author        = {Ma, Yiping and Hu, Shiyu and Li, Xuchen and Wang, Yipei and Chen, Yuqing and Liu, Shiqing and Cheong, Kang Hao},
      year          = {2025},
      eprint        = {2410.15701},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2410.15701}
    }

EduVerse:
  source: "arXiv:2510.05650 (arXiv API record, v1); abstract from arXiv:2510.05650; BibTeX follows arXiv's own export for the latest version (v1, checked 2026-10-21)"
  abstract: >-
    Reproducing cognitive development, group interaction, and long-term evolution in virtual
    classrooms remains a core challenge for educational AI, as real classrooms integrate open-ended
    cognition, dynamic social interaction, affective factors, and multi-session development rarely
    captured together. Existing approaches mostly focus on short-term or single-agent settings,
    limiting systematic study of classroom complexity and cross-task reuse. We present EduVerse, the
    first user-defined multi-agent simulation space that supports environment, agent, and session
    customization. A distinctive human-in-the-loop interface further allows real users to join the
    space. Built on a layered CIE (Cognition-Interaction-Evolution) architecture, EduVerse ensures
    individual consistency, authentic interaction, and longitudinal adaptation in cognition,
    emotion, and behavior-reproducing realistic classroom dynamics with seamless human-agent
    integration. We validate EduVerse in middle-school Chinese classes across three text genres,
    environments, and multiple sessions. Results show: (1) Instructional alignment: simulated IRF
    rates (0.28-0.64) closely match real classrooms (0.37-0.49), indicating pedagogical realism; (2)
    Group interaction and role differentiation: network density (0.27-0.40) with about one-third of
    peer links realized, while human-agent tasks indicate a balance between individual variability
    and instructional stability; (3) Cross-session evolution: the positive transition rate R+
    increase by 11.7% on average, capturing longitudinal shifts in behavior, emotion, and cognition
    and revealing structured learning trajectories. Overall, EduVerse balances realism,
    reproducibility, and interpretability, providing a scalable platform for educational AI. The
    system will be open-sourced to foster cross-disciplinary research.
  contributions:
    - "Introduces EduVerse, a user-defined multi-agent simulation space for classrooms that supports environment, agent and session customization, plus a human-in-the-loop interface for real users."
    - "Builds a layered Cognition-Interaction-Evolution (CIE) architecture for individual consistency, authentic interaction and longitudinal adaptation in cognition, emotion and behavior."
    - "Validates it in middle-school Chinese classes, with simulated IRF rates (0.28-0.64) close to real classrooms (0.37-0.49) and an average 11.7% rise in the positive transition rate across sessions."
  bibtex: |-
    @misc{ma2025eduverse,
      title         = {{EduVerse}: A User-Defined Multi-Agent Simulation Space for Education Scenario},
      author        = {Ma, Yiping and Hu, Shiyu and Zhu, Buyuan and Wang, Yipei and Kang, Yaxuan and Liu, Shiqing and Cheong, Kang Hao},
      year          = {2025},
      eprint        = {2510.05650},
      archivePrefix = {arXiv},
      primaryClass  = {cs.CV},
      url           = {https://arxiv.org/abs/2510.05650}
    }

EduPersona:
  source: "arXiv:2510.04648 (arXiv API record, v1); abstract from arXiv:2510.04648; BibTeX follows arXiv's own export for the latest version (v1, checked 2026-10-21)"
  abstract: >-
    As large language models are increasingly integrated into education, virtual student agents are
    becoming vital for classroom simulation and teacher training. Yet their classroom-oriented
    subjective abilities remain largely unassessed, limiting understanding of model boundaries and
    hindering trustworthy deployment. We present EduPersona, a large-scale benchmark spanning two
    languages, three subjects, and ten persona types based on the Big Five theory. The dataset
    contains 1,308 authentic classroom dialogue rounds, corresponding to 12,814 teacher-student Q&A
    turns, and is further expanded through persona stylization into roughly 10 times larger scale
    (128k turns), providing a solid foundation for evaluation. Building on this resource, we
    decompose hard-to-quantify subjective performance into three progressive tasks: TASK1 basic
    coherence (whether behavior, emotion, expression, and voice align with classroom context), TASK2
    student realism, and TASK3 long-term persona consistency, thereby establishing an evaluation
    framework grounded in educational theory and research value. We conduct systematic experiments
    on three representative LLMs, comparing their original versions with ten persona-fine-tuned
    variants trained on EduPersona. Results show consistent and significant average improvements
    across all tasks: TASK1 +33.6%, TASK2 +30.6%, and TASK3 +14.9%. These improvements highlight the
    dataset's effectiveness and research value, while also revealing the heterogeneous difficulty of
    persona modeling. In summary, EduPersona delivers the first classroom benchmark centered on
    subjective abilities, establishes a decoupled and verifiable research paradigm, and we will
    open-source both the dataset and the framework to support the broader research community in
    advancing trustworthy and human-like AI for education.
  contributions:
