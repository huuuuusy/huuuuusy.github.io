SpringerBook:
  source: "Springer book page; abstract adapted from the book preface"
  abstract: >-
    This book provides a systematic exploration of visual object tracking (VOT), focusing on its
    core principles, algorithmic techniques, evaluation methodologies, and future development
    trends. Adopting a “from fundamentals to frontier” approach, the book is organized into five
    logical modules: Foundations of Visual Tracking (Part I), Experimental Environment (Part II),
    Task Executors (Part III), Evaluation Techniques (Part IV), and Future Trends and Outlook (Part
    V). Beginning with short-term, long-term, and global instance tracking tasks, the book
    introduces their definitions, challenges, and key techniques, offering practical applications
    across diverse scenarios. By integrating traditional methods, deep learning paradigms, and
    insights from human vision theories, this book bridges foundational concepts and cutting-edge
    research in VOT.
  contributions:
    - "Treats visual object tracking from an evaluation perspective, from fundamentals to the frontier, in five parts: foundations, experimental environments, task executors, evaluation techniques, and future trends."
    - "Covers short-term, long-term, and global instance tracking, connecting traditional methods, deep learning, and findings on human vision."
    - "Brings task design, benchmark construction, and human–machine comparison such as the visual Turing test into one evaluation framework."
  bibtex: |-
    @book{zhao2025visual,
      title     = {Visual Object Tracking: An Evaluation Perspective},
      author    = {Zhao, Xin and Hu, Shiyu and Yin, Xu-Cheng},
      series    = {Advances in Computer Vision and Pattern Recognition},
      publisher = {Springer Nature Singapore},
      year      = {2025},
      isbn      = {978-981-96-4558-9},
      doi       = {10.1007/978-981-96-4558-9}
    }

GIT:
  source: "DOI 10.1109/TPAMI.2022.3153312 (Crossref); abstract from arXiv:2202.13073"
  abstract: >-
    Target tracking, the essential ability of the human visual system, has been simulated by
    computer vision tasks. However, existing trackers perform well in austere experimental
    environments but fail in challenges like occlusion and fast motion. The massive gap indicates
    that researches only measure tracking performance rather than intelligence. How to
    scientifically judge the intelligence level of trackers? Distinct from decision-making problems,
    lacking three requirements (a challenging task, a fair environment, and a scientific evaluation
    procedure) makes it strenuous to answer the question. In this article, we first propose the
    global instance tracking (GIT) task, which is supposed to search an arbitrary user-specified
    instance in a video without any assumptions about camera or motion consistency, to model the
    human visual tracking ability. Whereafter, we construct a high-quality and large-scale benchmark
    VideoCube to create a challenging environment. Finally, we design a scientific evaluation
    procedure using human capabilities as the baseline to judge tracking intelligence. Additionally,
    we provide an online platform with toolkit and an updated leaderboard. Although the experimental
    results indicate a definite gap between trackers and humans, we expect to take a step forward to
    generate authentic human-like trackers. The database, toolkit, evaluation server, and baseline
    results are available at http://videocube.aitestunion.com.
  contributions:
    - "Proposes global instance tracking (GIT): finding a user-specified instance anywhere in a video without assuming camera or motion continuity, as a task closer to human visual tracking."
    - "Builds VideoCube, a large-scale, high-quality benchmark of long videos with shot changes that serves as a challenging evaluation environment."
    - "Designs an evaluation procedure that uses human performance as the baseline, with an online platform, toolkit, and leaderboard."
  bibtex: |-
    @article{hu2023global,
      title   = {Global Instance Tracking: Locating Target More Like Humans},
      author  = {Hu, Shiyu and Zhao, Xin and Huang, Lianghua and Huang, Kaiqi},
      journal = {IEEE Transactions on Pattern Analysis and Machine Intelligence},
      volume  = {45},
      number  = {1},
      pages   = {576--592},
      year    = {2023},
      doi     = {10.1109/TPAMI.2022.3153312}
    }

SOTVerse:
  source: "DOI 10.1007/s11263-023-01908-5 (Crossref); abstract from arXiv:2204.07414"
  abstract: >-
    Single object tracking (SOT) research falls into a cycle -- trackers perform well on most
    benchmarks but quickly fail in challenging scenarios, causing researchers to doubt the
    insufficient data content and take more effort to construct larger datasets with more
    challenging situations. However, inefficient data utilization and limited evaluation methods
    more seriously hinder SOT research. The former causes existing datasets can not be exploited
    comprehensively, while the latter neglects challenging factors in the evaluation process. In
    this article, we systematize the representative benchmarks and form a Single Object Tracking
    metaverse (SOTVerse) -- a user-defined SOT task space to break through the bottleneck. We first
    propose a 3E Paradigm to describe tasks by three components (i.e., environment, evaluation, and
    executor). Then, we summarize task characteristics, clarify the organization standards, and
    construct SOTVerse with 12.56 million frames. Specifically, SOTVerse automatically labels
    challenging factors per frame, allowing users to generate user-defined spaces efficiently via
    construction rules. Besides, SOTVerse provides two mechanisms with new indicators and
    successfully evaluates trackers under various subtasks. Consequently, SOTVerse first provides a
    strategy to improve resource utilization in the computer vision area, making research more
    standardized and scientific. The SOTVerse, toolkit, evaluation server, and results are available
    at http://metaverse.aitestunion.com.
  contributions:
    - "Proposes the 3E paradigm, which describes a tracking task by its environment, evaluation, and executor."
    - "Builds SOTVerse, a user-defined task space of 12.56 million frames with per-frame challenge-factor labels, from which users generate sub-tasks through construction rules."
    - "Provides two evaluation mechanisms with new indicators that test trackers across sub-tasks and make fuller use of existing data."
  bibtex: |-
    @article{hu2024sotverse,
      title   = {{SOTVerse}: A User-Defined Task Space of Single Object Tracking},
      author  = {Hu, Shiyu and Zhao, Xin and Huang, Kaiqi},
      journal = {International Journal of Computer Vision},
      volume  = {132},
      number  = {3},
      pages   = {872--930},
      year    = {2024},
      doi     = {10.1007/s11263-023-01908-5}
    }

BioDrone:
  source: "DOI 10.1007/s11263-023-01937-0 (Crossref); abstract from arXiv:2402.04519"
  abstract: >-
    Single object tracking (SOT) is a fundamental problem in computer vision, with a wide range of
    applications, including autonomous driving, augmented reality, and robot navigation. The
    robustness of SOT faces two main challenges: tiny target and fast motion. These challenges are
    especially manifested in videos captured by unmanned aerial vehicles (UAV), where the target is
    usually far away from the camera and often with significant motion relative to the camera. To
    evaluate the robustness of SOT methods, we propose BioDrone -- the first bionic drone-based
    visual benchmark for SOT. Unlike existing UAV datasets, BioDrone features videos captured from a
    flapping-wing UAV system with a major camera shake due to its aerodynamics. BioDrone hence
    highlights the tracking of tiny targets with drastic changes between consecutive frames,
    providing a new robust vision benchmark for SOT. To date, BioDrone offers the largest UAV-based
    SOT benchmark with high-quality fine-grained manual annotations and automatically generates
    frame-level labels, designed for robust vision analyses. Leveraging our proposed BioDrone, we
    conduct a systematic evaluation of existing SOT methods, comparing the performance of 20
    representative models and studying novel means of optimizing a SOTA method (KeepTrack KeepTrack)
    for robust SOT. Our evaluation leads to new baselines and insights for robust SOT. Moving
    forward, we hope that BioDrone will not only serve as a high-quality benchmark for robust SOT,
    but also invite future research into robust computer vision. The database, toolkits, evaluation
    server, and baseline results are available at http://biodrone.aitestunion.com.
  contributions:
    - "Presents BioDrone, the first single object tracking benchmark captured by a bionic flapping-wing drone, with strong camera shake, tiny targets, and drastic changes between frames."
    - "Offers the largest UAV-based tracking benchmark with fine-grained manual annotations and automatically generated frame-level labels for robustness analysis."
    - "Evaluates 20 representative trackers and studies how to improve a state-of-the-art tracker for robust tracking, giving new baselines."
  bibtex: |-
    @article{zhao2024biodrone,
      title   = {{BioDrone}: A Bionic Drone-Based Single Object Tracking Benchmark for Robust Vision},
      author  = {Zhao, Xin and Hu, Shiyu and Wang, Yipei and Zhang, Jing and Hu, Yimin and Liu, Rongshuai and Ling, Haibin and Li, Yin and Li, Renshu and Liu, Kun and Li, Jiadong},
      journal = {International Journal of Computer Vision},
      volume  = {132},
      number  = {5},
      pages   = {1659--1684},
      year    = {2024},
      doi     = {10.1007/s11263-023-01937-0}
    }

MGIT:
  source: "NeurIPS proceedings (author name corrected from the official record); DOI 10.52202/075280-1087"
  abstract: >-
    Tracking an arbitrary moving target in a video sequence is the foundation for high-level tasks
    like video understanding. Although existing visual-based trackers have demonstrated good
    tracking capabilities in short video sequences, they always perform poorly in complex
    environments, as represented by the recently proposed global instance tracking task, which
    consists of longer videos with more complicated narrative content. Recently, several works have
    introduced natural language into object tracking, desiring to address the limitations of relying
    only on a single visual modality. However, these selected videos are still short sequences with
    uncomplicated spatio-temporal and causal relationships, and the provided semantic descriptions
    are too simple to characterize video content.To address these issues, we (1) first propose a new
    multi-modal global instance tracking benchmark named MGIT. It consists of 150 long video
    sequences with a total of 2.03 million frames, aiming to fully represent the complex spatio-
    temporal and causal relationships coupled in longer narrative content. (2) Each video sequence
    is annotated with three semantic grains (i.e., action, activity, and story) to model the
    progressive process of human cognition. We expect this multi-granular annotation strategy can
    provide a favorable environment for multi-modal object tracking research and long video
    understanding. (3) Besides, we execute comparative experiments on existing multi-modal object
    tracking benchmarks, which not only explore the impact of different annotation methods, but also
    validate that our annotation method is a feasible solution for coupling human understanding into
    semantic labels. (4) Additionally, we conduct detailed experimental analyses on MGIT, and hope
    the explored performance bottlenecks of existing algorithms can support further research in
    multi-modal object tracking. The proposed benchmark, experimental results, and toolkit will be
    released gradually on http://videocube.aitestunion.com/.
  contributions:
    - "Proposes MGIT, a multi-modal global instance tracking benchmark of 150 long videos (2.03 million frames) with complex spatio-temporal and causal relationships."
    - "Annotates every video at three semantic grains (action, activity, and story) to follow the progression of human understanding."
    - "Compares annotation strategies across multi-modal tracking benchmarks and analyzes where existing trackers break down on long narrative videos."
  bibtex: |-
    @inproceedings{hu2023multimodal,
      title     = {A Multi-modal Global Instance Tracking Benchmark ({MGIT}): Better Locating Target in Complex Spatio-temporal and Causal Relationship},
      author    = {Hu, Shiyu and Zhang, Dailing and Wu, Meiqi and Feng, Xiaokun and Li, Xuchen and Zhao, Xin and Huang, Kaiqi},
      booktitle = {Advances in Neural Information Processing Systems},
      volume    = {36},
      pages     = {25007--25030},
      year      = {2023},
      doi       = {10.52202/075280-1087}
    }

JIG-survey:
  source: "DOI 10.11834/jig.230498; English abstract from the published PDF"
  abstract: >-
    Single object tracking (SOT) task, which aims to model the human dynamic vision system and
    accomplish human-like object tracking ability in complex environments, has been widely used in
    various real-world applications like self-driving, video surveillance, and robot vision. Over
    the past decade, the development in deep learning has encouraged many research groups to work on
    designing different tracking frameworks like correlation filter (CF) and Siamese neural networks
    (SNNs), which facilitate the progress of SOT research. However, many factors (e.g., target
    deformation, fast motion, and illumination changes) in natural application scenes still
    challenge the SOT trackers. Thus, algorithms with novel architectures have been proposed for
    robust tracking and to achieve better performance in representative experimental environments.
    However, several poor cases in natural application environments reveal a large gap between the
    performance of state-of-the-art trackers and human expectations, which motivates us to pay close
    attention to the evaluation aspects. Therefore, instead of the traditional reviews that mainly
    concentrate on algorithm design, this study systematically reviews the visual intelligence
    evaluation techniques for SOT, including four key aspects: the task definition, evaluation
    environments, task executors, and evaluation mechanisms. First, we present the development
    direction of task definition, which includes the original short-term tracking, long-term
    tracking, and the recently proposed global instance tracking. With the evolution of the SOT
    definition, research has shown a progress from perceptual to cognitive intelligence. We also
    summa rize challenging factors in the SOT task to help readers understand the research
    bottlenecks in actual applications. Second, we compare the representative experimental
    environments in SOT evaluation. Unlike existing reviews that mainly introduce datasets based on
    chronological order, this study divides the environments into three categories (i.e., general
    datasets, dedicated datasets, and competition datasets) and introduces them separately. Third,
    we introduce the executors of SOT tasks, which not only include tracking algorithms represented
    by traditional trackers, CF-based trackers, SNN-based trackers, and Transformer-based trackers
    but also contain human visual tracking experiments conducted in interdisciplinary fields. To our
    knowledge, none of the existing SOT reviews have included related works on human dynamic visual
    ability. Therefore, introducing interdisciplinary works can also support the visual intelligence
    evaluation by comparing machines with humans and better reveal the intelligence degree of
    existing algorithm modeling methods. Fourth, we review the evaluation mechanism and metrics,
    which encompass traditional machine–machine and novel human–machine comparisons, and analyze the
    target tracking capability of various task executors. We also provide an overview of the
    human–machine comparison named visual Turing test, including its application in many vision
    tasks (e.g., image comprehension, game navigation, image classification, and image recognition)
    . Especially, we hope that this study can help researchers focus on this novel evaluation
    technique, better understand the capability bottlenecks, further explore the gaps between
    existing methods and humans, and finally achieve the goal of algorithmic intelligence. Finally,
    we indicate the evolution trend of visual intelligence evaluation techniques: 1) designing more
    human-like task definitions, 2) constructing more comprehensive and realistic evaluation
    environments, 3) including human subjects as task executors, and 4) using human abilities as a
    baseline to evaluate machine intelligence. In conclusion, this study summarizes the evolution
    trend of visual intelligence evaluation techniques for SOT task, further analyzes the existing
    challenge factors, and discusses the possible future research directions.
  contributions:
    - "Reviews single object tracking from the evaluation side rather than algorithm design, along four aspects: task definition, evaluation environments, task executors, and evaluation mechanisms."
    - "Traces how the task moved from short-term to long-term to global instance tracking, and groups evaluation environments into general, dedicated, and competition datasets."
    - "Includes studies of human dynamic visual ability and human–machine comparison (the visual Turing test), which earlier tracking surveys did not cover, and outlines future directions."
  bibtex: |-
    @article{hu2024visual,
      title   = {Visual Intelligence Evaluation Techniques for Single Object Tracking: A Survey},
      author  = {Hu, Shiyu and Zhao, Xin and Huang, Kaiqi},
      journal = {Journal of Image and Graphics},
      volume  = {29},
      number  = {8},
      pages   = {2269--2302},
      year    = {2024},
      doi     = {10.11834/jig.230498}
    }

ATCTrack:
  source: "ICCV 2025 (CVF open access); DOI 10.1109/ICCV51701.2025.01846; abstract from arXiv:2507.19875"
  abstract: >-
    Vision-language tracking aims to locate the target object in the video sequence using a template
    patch and a language description provided in the initial frame. To achieve robust tracking,
    especially in complex long-term scenarios that reflect real-world conditions as recently
    highlighted by MGIT, it is essential not only to characterize the target features but also to
    utilize the context features related to the target. However, the visual and textual target-
    context cues derived from the initial prompts generally align only with the initial target
    state. Due to their dynamic nature, target states are constantly changing, particularly in
    complex long-term sequences. It is intractable for these cues to continuously guide Vision-
    Language Trackers (VLTs). Furthermore, for the text prompts with diverse expressions, our
    experiments reveal that existing VLTs struggle to discern which words pertain to the target or
    the context, complicating the utilization of textual cues. In this work, we present a novel
    tracker named ATCTrack, which can obtain multimodal cues Aligned with the dynamic target states
    through comprehensive Target-Context feature modeling, thereby achieving robust tracking.
    Specifically, (1) for the visual modality, we propose an effective temporal visual target-
    context modeling approach that provides the tracker with timely visual cues. (2) For the textual
    modality, we achieve precise target words identification solely based on textual content, and
    design an innovative context words calibration method to adaptively utilize auxiliary context
    words. (3) We conduct extensive experiments on mainstream benchmarks and ATCTrack achieves a new
    SOTA performance. The code and models will be released at:
    https://github.com/XiaokunFeng/ATCTrack.
  contributions:
    - "Shows that target-context cues taken from the initial prompts drift away from the changing target state, and that trackers struggle to tell target words from context words."
    - "Proposes temporal visual target-context modeling that keeps the visual cues aligned with the current target state."
    - "Identifies target words from the text alone and adaptively calibrates context words, reaching state-of-the-art results on mainstream vision-language tracking benchmarks."
  bibtex: |-
    @inproceedings{feng2025atctrack,
      title     = {{ATCTrack}: Aligning Target-Context Cues with Dynamic Target States for Robust Vision-Language Tracking},
      author    = {Feng, Xiaokun and Hu, Shiyu and Li, Xuchen and Zhang, Dailing and Wu, Meiqi and Zhang, Jing and Chen, Xiaotang and Huang, Kaiqi},
      booktitle = {Proceedings of the IEEE/CVF International Conference on Computer Vision (ICCV)},
      pages     = {19850--19861},
      year      = {2025},
      doi       = {10.1109/ICCV51701.2025.01846}
    }

MATrack:
  source: "DOI 10.1109/ICRA57385.2026.11696451 (Crossref); abstract from arXiv:2510.21586"
  abstract: >-
    Nighttime UAV tracking faces significant challenges in real-world robotics operations. Low-light
    conditions not only limit visual perception capabilities, but cluttered backgrounds and frequent
    viewpoint changes also cause existing trackers to drift or fail during deployment. To address
    these difficulties, researchers have proposed solutions based on low-light enhancement and
    domain adaptation. However, these methods still have notable shortcomings in actual UAV systems:
    low-light enhancement often introduces visual artifacts, domain adaptation methods are
    computationally expensive and existing lightweight designs struggle to fully leverage dynamic
    object information. Based on an in-depth analysis of these key issues, we propose MATrack-a
    multiscale adaptive system designed specifically for nighttime UAV tracking. MATrack tackles the
    main technical challenges of nighttime tracking through the collaborative work of three core
    modules: Multiscale Hierarchy Blender (MHB) enhances feature consistency between static and
    dynamic templates. Adaptive Key Token Gate accurately identifies object information within
    complex backgrounds. Nighttime Template Calibrator (NTC) ensures stable tracking performance
    over long sequences. Extensive experiments show that MATrack achieves a significant performance
    improvement. On the UAVDark135 benchmark, its precision, normalized precision and AUC surpass
    state-of-the-art (SOTA) methods by 5.9%, 5.4% and 4.2% respectively, while maintaining a real-
    time processing speed of 81 FPS. Further tests on a real-world UAV platform validate the
    system's reliability, demonstrating that MATrack can provide stable and effective nighttime UAV
    tracking support for critical robotics applications such as nighttime search and rescue and
    border patrol.
  contributions:
    - "Proposes MATrack, a multiscale adaptive tracker for real-time nighttime UAV tracking."
    - "Combines three modules: a Multiscale Hierarchy Blender for consistent static and dynamic templates, an Adaptive Key Token Gate that finds the object in clutter, and a Nighttime Template Calibrator for stable long sequences."
    - "Improves precision, normalized precision, and AUC on UAVDark135 by 5.9%, 5.4%, and 4.2% over prior methods at 81 FPS, and is validated on a real UAV platform."
  bibtex: |-
    @inproceedings{li2026matrack,
      title     = {{MATrack}: Efficient Multiscale Adaptive Tracker for Real-Time Nighttime {UAV} Operations},
      author    = {Li, Xuzhao and Li, Xuchen and Hu, Shiyu},
      booktitle = {2026 IEEE International Conference on Robotics and Automation (ICRA)},
      pages     = {20399--20406},
      year      = {2026},
      doi       = {10.1109/ICRA57385.2026.11696451}
    }

DARTer:
  source: "DOI 10.1145/3731715.3733473 (Crossref); abstract from arXiv:2505.00752"
  abstract: >-
    Nighttime UAV tracking presents significant challenges due to extreme illumination variations
    and viewpoint changes, which severely degrade tracking performance. Existing approaches either
    rely on light enhancers with high computational costs or introduce redundant domain adaptation
    mechanisms, failing to fully utilize the dynamic features in varying perspectives. To address
    these issues, we propose DARTer (Dynamic Adaptive Representation Tracker), an end-to-end
    tracking framework designed for nighttime UAV scenarios. DARTer leverages a Dynamic Feature
    Blender (DFB) to effectively fuse multi-perspective nighttime features from static and dynamic
    templates, enhancing representation robustness. Meanwhile, a Dynamic Feature Activator (DFA)
    adaptively activates Vision Transformer layers based on extracted features, significantly
    improving efficiency by reducing redundant computations. Our model eliminates the need for
    complex multi-task loss functions, enabling a streamlined training process. Extensive
    experiments on multiple nighttime UAV tracking benchmarks demonstrate the superiority of DARTer
    over state-of-the-art trackers. These results confirm that DARTer effectively balances tracking
    accuracy and efficiency, making it a promising solution for real-world nighttime UAV tracking
    applications.
  contributions:
    - "Proposes DARTer, an end-to-end tracker for nighttime UAV scenes that needs neither a light enhancer nor domain adaptation."
    - "Uses a Dynamic Feature Blender to fuse multi-view features from static and dynamic templates, and a Dynamic Feature Activator that turns Vision Transformer layers on adaptively to cut redundant computation."
    - "Trains without complex multi-task losses and balances accuracy and efficiency on several nighttime UAV benchmarks."
  bibtex: |-
    @inproceedings{li2025darter,
      title     = {{DARTer}: Dynamic Adaptive Representation Tracker for Nighttime {UAV} Tracking},
      author    = {Li, Xuzhao and Li, Xuchen and Hu, Shiyu},
      booktitle = {Proceedings of the 2025 International Conference on Multimedia Retrieval},
      pages     = {1998--2002},
      publisher = {ACM},
      year      = {2025},
      doi       = {10.1145/3731715.3733473}
    }

MSAD:
  source: "DOI 10.1049/cvi2.70032 (Crossref); abstract from the published article"
  abstract: >-
    In recent years, the development of deep learning algorithms has significantly advanced the
    application of synthetic aperture radar (SAR) aircraft detection in remote sensing and military
    fields. However, existing methods face a dual dilemma: CNN-based models suffer from insufficient
    detection accuracy due to limitations in local receptive fields, whereas Transformer-based
    models improve accuracy by leveraging attention mechanisms but incur significant computational
    overhead due to their quadratic complexity. This imbalance between accuracy and efficiency
    severely limits the development of SAR aircraft detection. To address this problem, this paper
    propose a novel neural network based on state space models (SSM), termed the Mamba SAR detection
    network (MSAD). Specifically, we design a feature encoding module, MEBlock, that integrates CNN
    with SSM to enhance global feature modelling capabilities. Meanwhile, the linear computational
    complexity brought by SSM is superior to that of Transformer architectures, achieving a
    reduction in computational overhead. Additionally, we propose a context-aware feature fusion
    module (CAFF) that combines attention mechanisms to achieve adaptive fusion of multi-scale
    features. Lastly, a lightweight parameter-shared detection head (PSHead) is utilised to
    effectively reduce redundant parameters through implicit feature interaction. Experiments on the
    SAR-AirCraft-v1.0 and SADD datasets show that MSAD achieves higher accuracy than existing
    algorithms, whereas its GFLOPs are 2.7 times smaller than those of the Transformer architecture
    RT-DETR. These results validate the core role of SSM as an accuracy-efficiency balancer,
    reflecting MSAD's perceptual capability and performance in SAR aircraft detection in complex
    environments.
  contributions:
    - "Proposes MSAD, a state-space-model (Mamba) network for SAR aircraft detection that balances accuracy and efficiency."
    - "Designs MEBlock, which combines CNNs with state space models for global features at linear complexity, a context-aware feature fusion module, and a lightweight parameter-shared detection head."
    - "Achieves higher accuracy on SAR-AirCraft-v1.0 and SADD with 2.7 times fewer GFLOPs than the Transformer-based RT-DETR."
  bibtex: |-
    @article{wang2025improved,
      title   = {Improved {SAR} Aircraft Detection Algorithm Based on Visual State Space Models},
      author  = {Wang, Yaqiong and Zhang, Jing and Wang, Yipei and Hu, Shiyu and Shen, Baoguo and Hou, Zhenhua and Zhou, Wanting},
      journal = {IET Computer Vision},
      volume  = {19},
      number  = {1},
      pages   = {e70032},
      year    = {2025},
      doi     = {10.1049/cvi2.70032}
    }

META-PAP:
  source: "NeurIPS 2026 accepted poster (OpenReview yiQav1vmSS; neurips.cc/virtual/2026/poster/148316); proceedings not yet published, so BibTeX marked To appear; abstract from the NeurIPS 2026 virtual poster page (OpenReview abstract), LaTeX math cleaned"
  abstract: >-
    Direct Preference Optimization (DPO) has become a popular route for aligning large language
    models with human preferences, but existing pipelines treat all preference pairs uniformly and
    ignore prompt-level heterogeneity. We show that the optimal pair-selection strategy varies
    systematically with prompt characteristics: prompts with concentrated reward distributions
    benefit from large reward-gap pairs that provide unambiguous signal, while prompts with diverse
    responses benefit from moderate-gap pairs because extreme positions are dominated by outliers.
    No fixed strategy is optimal across this heterogeneity. We propose META-PAP (Meta-learning for
    Prompt-aware Preference Pairing), a framework that turns this observation into a learned
    algorithm. META-PAP generates multiple diverse pairs per prompt via a structured grid over the
    response reward distribution, extracts a compact prompt-aware feature vector, and trains a
    lightweight meta-network through bilevel optimization to predict per-pair weights. The inner
    loop is a weighted DPO update; the outer loop evaluates a virtual policy on a small clean
    meta-set. Across Llama-3-8B, Mistral-7B-v0.3, and Llama-2-7B, META-PAP consistently outperforms
    vanilla DPO, fixed-position pairing, reward-gap weighting, top-k filtering, curriculum, and
    statistical rejection sampling, with average gains of +3.9 points on AlpacaEval 2.0 and +3.2
    points on Arena-Hard, and approaches an oracle that exhaustively searches per prompt. The
    learned weighting policy is interpretable: it favors large-gap pairs on low-diversity prompts
    and softly rejects extreme pairs on high-diversity prompts. We additionally find that the
    meta-network requires only M=150 pairs to saturate, transfers across domains, tolerates label
    noise on the meta-set, and remains effective with as few as n=32 on-policy samples per prompt.
  contributions:
    - "Shows that the best preference-pair selection strategy for DPO varies with prompt characteristics, so no fixed pairing strategy is optimal across prompts."
    - "Proposes META-PAP, which builds diverse pairs per prompt on a reward-distribution grid and trains a lightweight meta-network by bilevel optimization to predict per-pair weights for weighted DPO."
    - "Shows average gains of +3.9 points on AlpacaEval 2.0 and +3.2 on Arena-Hard over DPO and other pairing baselines across Llama-3-8B, Mistral-7B-v0.3 and Llama-2-7B."
  bibtex: |-
    @inproceedings{zhao2026metapap,
      title     = {{META-PAP}: Meta-learning for Prompt-aware Preference Pairing in {LLM} Alignment},
      author    = {Zhao, Pinlong and Hu, Shiyu and Zhang, Jing and Li, Mengyang},
      booktitle = {Advances in Neural Information Processing Systems},
      year      = {2026},
      note      = {To appear}
    }

EARL:
  source: "CVF Open Access CVPR 2026 BibTeX (pages 25621-25632; no DOI listed yet); abstract from CVF Open Access page (identical to arXiv:2510.15440)"
  abstract: >-
    Long-form video reasoning remains a major challenge for Video Large Language Models (Video
    LLMs), as static uniform frame sampling leads to information dilution and obscures critical
    evidence. Furthermore, existing pixel-space video reasoning agents, which are designed to
    actively interact with the video to acquire new visual information, remain suboptimal due to
    their lack of rigorous reward mechanisms to enforce evidence purity and their inability to
    perform temporal information supplementation beyond pre-sampled frames. To address this critical
    gap, we propose a novel evidence-prioritized adaptive framework built upon our core philosophy:
    "Select Less, Reason More." Our core contribution is the evidence-aware reinforcement learning
    (EARL) framework, which transforms the model into an active interrogator of evidence. EARL is
    precisely engineered to dynamically select the most relevant frames and, crucially, to perform
    localized re-sampling around the selected key frames to access fine-grained temporal detail.
    Extensive experiments on five demanding video reasoning benchmarks demonstrate that our
    EARL-trained model achieves new state-of-the-art among open-source Video LLMs, simultaneously
    learning an effective and high-purity visual evidence selection policy. Impressively, our 7B
    model achieves 59.8% on LongVideoBench, 69.0% on MVBench and 64.9% on VideoMME. These results
    highlight the importance of prioritizing evidence purity and the effectiveness of our framework.
  contributions:
    - "Proposes EARL, an evidence-aware reinforcement learning framework that trains Video LLMs to select the most relevant frames and enforce evidence purity during video reasoning."
    - "Introduces localized re-sampling around selected key frames, giving the model fine-grained temporal detail beyond the pre-sampled frames."
    - "Shows a new state of the art among open-source Video LLMs on five benchmarks, with the 7B model reaching 59.8% on LongVideoBench, 69.0% on MVBench and 64.9% on VideoMME."
  bibtex: |-
    @inproceedings{li2026select,
      title     = {Select Less, Reason More: Prioritizing Evidence Purity for Video Reasoning},
      author    = {Li, Xuchen and Li, Xuzhao and Hu, Shiyu and Huang, Kaiqi},
      booktitle = {Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition},
      pages     = {25621--25632},
      year      = {2026}
    }

CausalStep:
  source: "DOI 10.1609/aaai.v40i8.37582 (Crossref / AAAI OJS); abstract from AAAI OJS article page 37582"
  abstract: >-
    Recent advances in large language models (LLMs) have improved reasoning in text and image
    domains, yet achieving robust video reasoning remains a significant challenge. Existing video
    benchmarks mainly assess shallow understanding and reasoning and allow models to exploit global
    context, failing to rigorously evaluate true causal and stepwise reasoning. We present
    CausalStep, a benchmark designed for explicit stepwise causal reasoning in videos. CausalStep
    segments videos into causally linked units and enforces a strict stepwise question-answer (QA)
    protocol, requiring sequential answers and preventing shortcut solutions. Each question includes
    carefully constructed distractors based on error type taxonomy to ensure diagnostic value. The
    benchmark features 100 videos across six categories and 1,852 multiple-choice QA pairs. We
    introduce seven diagnostic metrics for comprehensive evaluation, enabling precise diagnosis of
    causal reasoning capabilities. Experiments with leading proprietary and open-source models, as
    well as human baselines, reveal a significant gap between current models and human-level
    stepwise reasoning. CausalStep provides a rigorous benchmark to drive progress in robust and
    interpretable video reasoning.
  contributions:
    - "Builds CausalStep, a benchmark of 100 videos across six categories and 1,852 multiple-choice QA pairs for explicit stepwise causal reasoning in videos."
    - "Designs a strict stepwise QA protocol over causally linked video segments, with taxonomy-based distractors and seven diagnostic metrics that block shortcut solutions."
    - "Shows, by evaluating leading proprietary and open-source models against human baselines, a significant gap between current models and human-level stepwise reasoning."
  bibtex: |-
    @inproceedings{li2026causalstep,
      title     = {{CausalStep}: A Benchmark for Explicit Stepwise Causal Reasoning in Videos},
      author    = {Li, Xuchen and Li, Xuzhao and Hu, Shiyu and Huang, Kaiqi and Zhang, Wentao},
      booktitle = {Proceedings of the AAAI Conference on Artificial Intelligence},
      volume    = {40},
      number    = {8},
      pages     = {6530--6538},
      year      = {2026},
      doi       = {10.1609/aaai.v40i8.37582}
    }

VerifyBench:
  source: "DOI 10.1609/aaai.v40i38.40448 (Crossref / AAAI OJS); abstract from AAAI OJS article page 40448 (differs slightly from arXiv:2507.09884)"
  abstract: >-
    Large language models (LLMs) increasingly rely on reinforcement learning (RL) to enhance their
    reasoning capabilities through feedback. A critical challenge is verifying the consistency of
    model-generated responses and reference answers, since these responses are often lengthy,
    diverse, and nuanced. Rule-based verifiers struggle with complexity, prompting the use of
    model-based verifiers. Existing research primarily focuses on building better verifiers, yet a
    systematic evaluation of different types of verifiers' performance across domains remains
    lacking, severely constraining the reliable development of Reinforcement Learning with
    Verifiable Reward (RLVR). To address this, we propose VerifyBench--a cross-domain comprehensive
    benchmark for systematically evaluating verifiers. We construct about 4,000 expert-level
    questions covering mathematics, physics, chemistry, and biology. Questions are equipped with
    reference answers and diverse responses. The reliability of the evaluation is ensured through a
    rigorous collection and annotation process conducted by a multidisciplinary expert team. We
    design a four-dimensional experimental framework to comprehensively compare the performance
    boundaries of specialized verifiers and general LLMs under combined conditions of extracted
    answers vs. complete responses, and short vs. long outputs. Our evaluation uncovers fundamental
    trade-offs in verifiers: while specialized verifiers achieve leading accuracy (the best model
    reaching 96.48% in chemistry), they exhibit deficiencies in recall; general models show stronger
    inclusivity but unstable accuracy. More importantly, we discover verifiers' high sensitivity to
    input structure and inherent limitations in cross-domain generalization, providing critical
    insights into the bottlenecks of current verifier technology.
  contributions:
    - "Builds VerifyBench, a cross-domain benchmark of about 4,000 expert-level questions in mathematics, physics, chemistry and biology, each with reference answers and diverse responses, annotated by a multidisciplinary expert team."
    - "Designs a four-dimensional evaluation framework comparing specialized verifiers and general LLMs on extracted answers versus complete responses and short versus long outputs."
    - "Shows that specialized verifiers lead in accuracy (up to 96.48% in chemistry) but lack recall, while general models are more inclusive but less stable, and that verifiers are sensitive to input structure."
  bibtex: |-
    @inproceedings{li2026verifybench,
      title     = {{VerifyBench}: A Systematic Benchmark for Evaluating Reasoning Verifiers Across Domains},
      author    = {Li, Xuzhao and Li, Xuchen and Hu, Shiyu and Guo, Yongzhen and Zhang, Wentao},
      booktitle = {Proceedings of the AAAI Conference on Artificial Intelligence},
      volume    = {40},
      number    = {38},
      pages     = {31796--31804},
      year      = {2026},
      doi       = {10.1609/aaai.v40i38.40448}
    }

NarrLV:
  source: "ICLR 2026 proceedings BibTeX (proceedings.iclr.cc, pages 20966-21000; no DOI); official title ends 'for Long Video Generation' (no 'Models'); abstract from ICLR 2026 proceedings page"
  abstract: >-
    With the rapid development of foundation video generation technologies, long video generation
    models have exhibited promising research potential thanks to expanded content creation space.
    Recent studies reveal that the goal of long video generation tasks is not only to extend video
    duration but also to accurately express richer narrative content within longer videos. However,
    due to the lack of evaluation benchmarks specifically designed for long video generation models,
    the current assessment of these models primarily relies on benchmarks with simple narrative
    prompts (e.g., VBench). To the best of our knowledge, our proposed NarrLV is the first benchmark
    to comprehensively evaluate the Narrative expression capabilities of Long Video generation
    models. Inspired by film narrative theory, (i) we first introduce the basic narrative unit
    maintaining continuous visual presentation in videos as Temporal Narrative Atom (TNA), and use
    its count to quantitatively measure narrative richness. Guided by three key film narrative
    elements influencing TNA changes, we construct an automatic prompt generation pipeline capable
    of producing evaluation prompts with a flexibly expandable number of TNAs. (ii) Then, based on
    the three progressive levels of narrative content expression, we design an effective evaluation
    metric using the MLLM-based question generation and answering framework. (iii) Finally, we
    conduct extensive evaluations on existing long video generation models and the foundation
    generation models that underpin them. Experimental results demonstrate that our metric aligns
    closely with human judgments. The derived evaluation outcomes reveal the detailed capability
    boundaries of current video generation models in narrative content expression.
  contributions:
    - "Introduces NarrLV, a benchmark for the narrative expression capabilities of long video generation models, built on the Temporal Narrative Atom (TNA) as a measurable unit of narrative richness."
    - "Builds an automatic prompt generation pipeline, guided by three film narrative elements, that produces evaluation prompts with a flexibly expandable number of TNAs."
    - "Designs an MLLM-based question generation and answering metric over three progressive levels of narrative expression and shows it aligns closely with human judgments."
  bibtex: |-
    @inproceedings{feng2026narrlv,
      title     = {{NarrLV}: Towards a Comprehensive Narrative-Centric Evaluation for Long Video Generation},
      author    = {Feng, Xiaokun and Yu, Haiming and Wu, Meiqi and Hu, Shiyu and Chen, Jintao and Zhu, Chen and Wu, Jiahong and Chu, Xiangxiang and Huang, Kaiqi},
      booktitle = {International Conference on Learning Representations},
      pages     = {20966--21000},
      year      = {2026}
    }

RGRL:
  source: "DOI 10.18653/v1/2026.acl-long.225 (ACL Anthology .bib, Crossref); abstract from ACL Anthology page"
  abstract: >-
    Vision-Language Models (VLMs) excel at many multimodal tasks, yet they frequently struggle with
    tasks requiring precise understanding and handling of fine-grained visual elements. This is
    mainly due to information loss during image encoding or insufficient attention to critical
    regions. Recent work has shown promise by incorporating pixel-level visual information into the
    reasoning process, enabling VLMs to access high-resolution visual details during their thought
    process. However, this pixel-level information is often overused, leading to inefficiency and
    distraction from irrelevant visual details. To address these challenges, we propose the first
    framework for adaptive pixel reasoning that dynamically determines necessary pixel-level
    operations based on the input query. Specifically, we first apply operation-aware supervised
    fine-tuning to establish baseline competence in textual reasoning and visual operations, then
    design a novel rollout-guided reinforcement learning framework relying on feedback of the
    model’s own responses, which enables the VLM to determine when pixel operations should be
    invoked based on query difficulty. Experiments on extensive multimodal reasoning benchmarks show
    that our model achieves superior performance while significantly reducing unnecessary visual
    operations. Impressively, our model achieves 73.4% accuracy on HR-Bench 4K while maintaining a
    tool usage ratio of only 20.1%, improving accuracy and simultaneously reducing tool usage by
    66.5% compared to the previous methods.
  contributions:
    - "Proposes the first adaptive pixel-space reasoning framework, letting a VLM decide from the query whether pixel-level visual operations are needed."
    - "Designs a two-stage recipe: operation-aware supervised fine-tuning, then rollout-guided reinforcement learning that uses feedback from the model's own responses to decide when to invoke pixel operations."
    - "Shows 73.4% accuracy on HR-Bench 4K with a tool usage ratio of only 20.1%, cutting tool usage by 66.5% while improving accuracy over previous methods."
  bibtex: |-
    @inproceedings{li2026look,
      title     = {Look Less, Reason More: Rollout-Guided Adaptive Pixel-Space Reasoning},
      author    = {Li, Xuchen and Li, Xuzhao and Gao, Jiahui and Pi, Renjie and Hu, Shiyu and Zhang, Wentao},
      booktitle = {Proceedings of the 64th Annual Meeting of the Association for Computational Linguistics (Volume 1: Long Papers)},
      pages     = {4948--4967},
      year      = {2026},
      doi       = {10.18653/v1/2026.acl-long.225}
    }

TBDQ:
  source: "DOI 10.1016/j.patcog.2026.113552 (Crossref: vol. 179, article 113552; official title in sentence case, title case kept); abstract from arXiv:2411.06197v3 (accepted version; ScienceDirect page not accessible, text matches Semantic Scholar record of the DOI)"
  abstract: >-
    Multi-object tracking (MOT) is primarily dominated by two paradigms: tracking-by-detection (TBD)
    and tracking-by-query (TBQ). While TBD offers modular efficiency, its fragmented association
    pipeline often limits robustness in complex scenarios. Conversely, TBQ enhances semantic
    modeling end-to-end but suffers from high training costs and slow inference due to the tight
    coupling of detection and association. In this work, we propose the
    tracking-by-detection-and-query framework, TBDQ-Net, to advance the synergy between TBD and TBQ
    paradigms. By integrating a frozen detector with a lightweight associator, this architecture
    ensures intrinsic efficiency. Within this streamlined framework, we introduce tailored designs
    to address MOT-specific challenges. Concretely, we alleviate task conflicts and occlusions
    through the dual-stream update of the Basic Information Interaction (BII) module. The
    Content-Position Alignment (CPA) module further refines both content and positional components,
    providing well-aligned representations for association decoding. Extensive evaluations on
    DanceTrack, SportsMOT, and MOT20 benchmarks demonstrate that TBDQ-Net achieves a favorable
    efficiency-accuracy trade-off in challenging scenarios. Specifically, TBDQ-Net outperforms
    leading TBD methods by 6.0 IDF1 points on DanceTrack and achieves the best performance among TBQ
    methods in the crowded MOT20 benchmark. Relative to MOTRv2, TBDQ-Net reduces trainable
    parameters by approximately 80% while accelerating practical inference by 37.5%. These results
    highlight TBDQ-Net as an efficient alternative to heavy architectures, showcasing the efficacy
    of lightweight design. Source code is publicly available at
    https://github.com/FaithFlow/TBDQ-Net.
  contributions:
    - "Proposes TBDQ-Net, a tracking-by-detection-and-query framework that pairs a frozen detector with a lightweight associator to combine the strengths of TBD and TBQ paradigms."
    - "Introduces the Basic Information Interaction (BII) module for task conflicts and occlusions and the Content-Position Alignment (CPA) module for well-aligned association representations."
    - "Shows a 6.0 IDF1 gain over leading TBD methods on DanceTrack and, relative to MOTRv2, about 80% fewer trainable parameters with 37.5% faster inference."
  bibtex: |-
    @article{jia2026tracking,
      title   = {Tracking by Detection and Query: An Efficient End-to-End Framework for Multi-Object Tracking},
      author  = {Jia, Shukun and Hu, Shiyu and Cao, Yichao and Yang, Feng and Lu, Xin and Lu, Xiaobo},
      journal = {Pattern Recognition},
      volume  = {179},
      pages   = {113552},
      year    = {2026},
      doi     = {10.1016/j.patcog.2026.113552}
    }

DAAWBench:
  source: "DOI 10.1109/TCSVT.2026.3670256 (Crossref / IEEE Xplore: vol. 36, no. 7, pp. 10632-10644; official title capitalises 'With'); abstract from IEEE Xplore document 11421430, inline TeX cleaned"
  abstract: >-
    Air-writing has emerged as a promising communication modality for AR/VR and metaverse
    environments, enabling quiet, non-contact text input by translating finger movements into
    natural language. However, existing approaches typically project in-air writing onto a virtual
    2D plane and assume characters are formed with a single continuous stroke–an oversimplification
    that neglects the rich 3D structure inherent in natural handwriting. In this work, we challenge
    the “single-stroke 2D” paradigm and explore the role of depth cues in enhancing air-writing
    recognition. To this end, we present DAAWBench, the first large-scale Depth-Aware Air-Writing
    dataset, featuring 8.8 million RGB-D frames annotated with 3,755 Chinese characters from the
    GB2312-80 Level-1 set. Our analysis reveals consistent depth variations at stroke boundaries,
    indicating that stroke segmentation and character recognition can benefit from depth modeling.
    Based on these insights, we propose DARec, a novel 3D trajectory-based recognition model that
    effectively leverages depth-aware priors. Extensive experiments across in-domain and
    out-of-domain settings, including evaluations with vision-language models (e.g., GPT-4o,
    Qwen-VL) and human baselines, show that DARec significantly outperforms 2D-only counterparts,
    achieving 87.73% accuracy versus 9.05%. Our findings demonstrate the critical importance of
    depth modeling in human-computer co-creative interfaces, and we will publicly release our
    dataset and code at https://github.com/wmeiqi/DAAWBench
  contributions:
    - "Builds DAAWBench, the first large-scale depth-aware air-writing dataset, with 8.8 million RGB-D frames annotated with 3,755 Chinese characters from the GB2312-80 Level-1 set."
    - "Shows that depth varies consistently at stroke boundaries, challenging the single-stroke 2D assumption of existing air-writing recognition."
    - "Proposes DARec, a 3D trajectory-based recognizer using depth-aware priors, which reaches 87.73% accuracy versus 9.05% for 2D-only counterparts."
  bibtex: |-
    @article{wu2026talk,
      title   = {Talk With Your Fingers: A Depth-Aware Benchmark for Air-Writing Recognition},
      author  = {Wu, Meiqi and Zhao, Yuzhong and Li, Xuchen and Hu, Shiyu and Cai, Yuanqiang and Wu, Jiahong and Wang, Weiqiang and Huang, Kaiqi},
      journal = {IEEE Transactions on Circuits and Systems for Video Technology},
      volume  = {36},
      number  = {7},
      pages   = {10632--10644},
      year    = {2026},
      doi     = {10.1109/TCSVT.2026.3670256}
    }

COAL:
  source: "DOI 10.24963/ijcai.2026/141 (IJCAI 2026 proceedings BibTeX, pp. 1261-1269); abstract from IJCAI proceedings page 2026/141 (arXiv version is 2605.14795, not 2411.06197)"
  abstract: >-
    Referring Multi-Object Tracking (RMOT) faces a fundamental structural contradiction between the
    high-discriminability demand and the sparse semantic supervision. This mismatch is particularly
    acute in highly homogeneous scenarios that require fine-grained discrimination over complex
    compositional semantics. However, under sparse supervision, models overfit to salient yet
    insufficient cues, leading to shortcut learning and degraded compositional discrimination. To
    resolve this, we propose COAL (Counterfactual and Observation-enhanced Alignment Learning), a
    framework that advances RMOT beyond isolated structural optimization through knowledge
    regularization. First, we introduce Explicit Semantic Injection (ESI) via a VLM to densify the
    observation space and enhance instance discriminability. Second, leveraging LLM reasoning, we
    propose Counterfactual Learning (CFL) to augment supervision, enforcing strict attribute
    verification for robust compositional recognition. These strategies are unified within a
    Hierarchical Multi-Stream Integration (HMSI) architecture, which distills external knowledge
    into domain-specific discriminative representations. Experiments on Refer-KITTI and
    Refer-KITTI-V2 benchmarks validate COAL's efficacy. Notably, it surpasses the state-of-the-art
    by 7.28% HOTA on the highly challenging Refer-KITTI-V2. These results demonstrate the
    effectiveness of knowledge regularization for resolving the sparsity–discriminability paradox in
    RMOT.
  contributions:
    - "Proposes COAL, a referring multi-object tracking framework that uses knowledge regularization to resolve the conflict between high discriminability demands and sparse semantic supervision."
    - "Introduces VLM-based Explicit Semantic Injection and LLM-driven Counterfactual Learning, unified in a Hierarchical Multi-Stream Integration architecture that distills external knowledge into discriminative representations."
    - "Shows a 7.28% HOTA gain over the state of the art on Refer-KITTI-V2, with further validation on Refer-KITTI."
  bibtex: |-
    @inproceedings{jia2026coal,
      title     = {{COAL}: Counterfactual and Observation-Enhanced Alignment Learning for Discriminative Referring Multi-Object Tracking},
      author    = {Jia, Shukun and Hu, Shiyu and Wang, Yipei and Cheng, Ximeng and Cao, Yichao and Lu, Xiaobo},
      booktitle = {Proceedings of the Thirty-Fifth International Joint Conference on Artificial Intelligence, {IJCAI-26}},
      pages     = {1261--1269},
      year      = {2026},
      doi       = {10.24963/ijcai.2026/141}
    }

ECCV26-Temporal:
  source: "DOI 10.1007/978-3-032-37432-5_12 (Crossref / Springer: LNCS vol. 17032, pp. 202-220); official title has no 'DASTrack:' prefix; abstract from the Springer chapter page"
  abstract: >-
    Visual object tracking relies on modeling cross-frame dynamics, and recent approaches employ
    learnable temporal tokens to encode historical information. However, our analysis reveals that
    these tokens are often marginalized by dominant spatial features during joint optimization. This
    imbalance leads to shortcut learning where the network over-relies on current-frame appearance,
    causing temporal representation collapse. To address this, we propose DASTrack, a framework
    featuring Decoupled Auxiliary Supervision (DAS). By masking the templates during an auxiliary
    forward pass, DAS compels the network to localize targets using only temporal tokens and thus
    encode robust cross-frame priors. This mechanism is applied strictly during training and
    discarded at inference to preserve the original architecture and computational efficiency.
    DASTrack yields consistent and interpretable average performance gains across multiple
    backbones. Our findings demonstrate that the primary bottleneck in temporal tracking stems from
    biased learning dynamics rather than architectural design, offering a novel training paradigm
    for eliciting latent temporal capabilities. The code and models will be released at:
    https://github.com/ZhangDailing8/DASTrack.
  contributions:
    - "Shows that learnable temporal tokens in visual trackers are marginalized by dominant spatial features, causing shortcut learning and temporal representation collapse."
    - "Proposes DASTrack with Decoupled Auxiliary Supervision, which masks templates in an auxiliary training pass so the network must localize targets from temporal tokens alone."
    - "Shows consistent average gains across multiple backbones with no inference-time cost, since the auxiliary pass is discarded after training."
  bibtex: |-
    @inproceedings{zhang2026rethinking,
      title     = {Rethinking Temporal Modeling in Visual Object Tracking via Decoupled Auxiliary Supervision},
      author    = {Zhang, Dailing and Hu, Shiyu and Fu, Honghao and Feng, Xiaokun and Wang, Yipei and Cheong, Kang Hao and Huang, Kaiqi},
      booktitle = {Computer Vision -- {ECCV} 2026},
      series    = {Lecture Notes in Computer Science},
      volume    = {17032},
      pages     = {202--220},
      publisher = {Springer},
      year      = {2026},
      doi       = {10.1007/978-3-032-37432-5_12}
    }

FakeNewsCourt:
  source: "ACL Anthology 2026.emnlp-main.2022 (.bib: pages 46053-46063; no DOI registered with Crossref as of 2026-10-27, so the BibTeX gives the Anthology URL); abstract and contributions from the Anthology PDF"
  abstract: >-
    Large language models (LLMs) have achieved remarkable success across many domains, yet their
    generative capabilities have been misused to produce highly realistic fake news that threatens
    social stability. However, the main existing detection methods, including small language model
    (SLM)-based approaches and LLM-based detectors, exhibit substantial performance degradation on
    LLM-generated content, reflecting a lack of robustness. SLM-based detectors rely heavily on
    fixed data distributions and shallow textual cues, while LLM-based detectors depend on
    prompt-based inference, making them sensitive to prompting and vulnerable to LLM hallucinations.
    To address this challenge, we propose Fake News Court (FNC), a robust multi-agent adversarial
    framework that integrates the complementary strengths of LLM and SLM for detecting LLM-generated
    fake news. FNC adopts an adversarial learning paradigm in which a quality-controlled generator
    produces diverse and challenging fake news, while a hybrid detector combines multi-dimensional
    LLM-based agent reasoning with an SLM-based classifier to ensure stable decisions. Extensive
    experiments show that FNC achieves an overall accuracy improvement of approximately 6% over
    competitive baselines on LLM-generated fake news, confirming its robustness.
  contributions:
    - "Proposes Fake News Court (FNC), a multi-agent adversarial framework that combines LLM-based generation and reasoning with SLM-based judgment to detect LLM-generated fake news."
    - "Introduces a quality-controlled generator with alignment-gate filtering, and a hybrid detector that separates multi-dimensional reasoning by LLM agents from the final decision of an SLM classifier."
    - "Improves overall accuracy by about 6% over competitive baselines on LLM-generated fake news."
  bibtex: |-
    @inproceedings{peng2026fake,
      title     = {Fake News Court: A Multi-Agent Adversarial Framework for Robust Detection of {LLM}-Generated Fake News},
      author    = {Peng, Mengyao and Gu, Hongyan and Ma, Yiping and Hu, Shiyu and Huang, Xinli},
      booktitle = {Proceedings of the 2026 Conference on Empirical Methods in Natural Language Processing},
      pages     = {46053--46063},
      year      = {2026},
      url       = {https://aclanthology.org/2026.emnlp-main.2022/}
    }

ViEBench:
  source: "ACL Anthology 2026.findings-emnlp.596 (.bib and PDF: pages 12577-12591; Xuzhao Li and Xuchen Li are equal first authors, Xuzhao Li listed first, which corrects the earlier arXiv order; no DOI registered with Crossref as of 2026-10-27, so the BibTeX gives the Anthology URL); abstract from arXiv:2601.11633, matching the Anthology PDF"
  abstract: >-
    Despite the remarkable progress of Vision-Language Models (VLMs) in adopting
    "Thinking-with-Images" capabilities, accurately evaluating the authenticity of their reasoning
    process remains a critical challenge. Existing benchmarks mainly rely on outcome-oriented
    accuracy, lacking the capability to assess whether models can accurately leverage fine-grained
    visual cues for multi-step reasoning. To address these limitations, we propose ViEBench, a
    process-verifiable benchmark designed to evaluate faithful visual reasoning. Comprising 200
    multi-scenario high-resolution images with expert-annotated visual evidence, ViEBench uniquely
    categorizes tasks by difficulty into perception and reasoning dimensions, where reasoning tasks
    require utilizing localized visual details with prior knowledge. To establish comprehensive
    evaluation criteria, we introduce a dual-axis matrix that provides fine-grained metrics through
    four diagnostic quadrants, enabling transparent diagnosis of model behavior across varying task
    complexities. Our experiments yield several interesting observations: (1) VLMs can sometimes
    produce correct final answers despite grounding on irrelevant regions, and (2) they may
    successfully locate the correct evidence but still fail to utilize it to reach accurate
    conclusions. Our findings demonstrate that ViEBench can serve as a more explainable and
    practical benchmark for comprehensively evaluating the effectiveness agentic VLMs. The codes
    will be released at: https://github.com/Xuchen-Li/ViEBench.
  contributions:
    - "Builds ViEBench, a process-verifiable benchmark of 200 multi-scenario high-resolution images with expert-annotated visual evidence, split into perception and reasoning tasks."
    - "Introduces a dual-axis evaluation matrix with four diagnostic quadrants that assesses whether thinking-with-images models ground their reasoning in the right visual evidence."
    - "Shows that VLMs can reach correct answers while grounding on irrelevant regions, and can locate the correct evidence yet still fail to use it."
  bibtex: |-
    @inproceedings{li2026beyond,
      title     = {Beyond Accuracy: Evaluating Grounded Visual Evidence in Thinking with Images},
      author    = {Li, Xuzhao and Li, Xuchen and Pi, Renjie and Hu, Shiyu and Zhao, Jian and Gao, Jiahui},
      booktitle = {Findings of the Association for Computational Linguistics: {EMNLP} 2026},
      pages     = {12577--12591},
      year      = {2026},
      url       = {https://aclanthology.org/2026.findings-emnlp.596/}
    }

