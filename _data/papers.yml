HyperRationality:
  source: "DOI 10.1109/TNSE.2026.3742449 (Crossref/IEEE Xplore 11737546, Early Access: no volume/issue yet, placeholder pages 1-18 omitted); abstract from IEEE Xplore"
  abstract: >-
    Large language models (LLMs) are increasingly integrated into agent-based models (ABMs) and
    multi-agent systems, giving rise to generative agent networks for social simulation and
    collective behavior modeling. While these agents exhibit strong capabilities in language
    generation, memory, and strategic planning, recent studies report decision convergence and
    behavioral variance compression, suggesting a form of hyper-rationality that may suppress
    micro-level heterogeneity and reshape macro-level network dynamics. This survey is organized
    along three dimensions. First, we review the conceptual foundations of persona modeling and
    agent-based social simulation, together with methodological approaches for inducing
    persona-driven heterogeneity in LLM-based agents. Second, we examine system-level
    implementations of LLM-based agents in social simulations, focusing on how heterogeneity affects
    interaction patterns, social dynamics, and collective behaviors. Third, we summarize the
    methodological and ethical challenges of evaluating behavioral heterogeneity in generative agent
    networks, including variance preservation, decision correlation, coherence, stability, and bias
    in automated evaluation. By connecting heterogeneity modeling, social simulation systems, and
    evaluation perspectives, this survey provides a structured synthesis of current approaches and
    highlights key directions for understanding and studying collective behavior in generative agent
    systems.
  contributions:
    - "Reviews the conceptual foundations of persona modeling and agent-based social simulation, and methods for inducing persona-driven heterogeneity in LLM-based agents to counter hyper-rational decision convergence."
    - "Examines system-level implementations of LLM-based agents in social simulations, focusing on how heterogeneity affects interaction patterns, social dynamics and collective behaviors."
    - "Summarizes methodological and ethical challenges in evaluating behavioral heterogeneity in generative agent networks, including variance preservation, decision correlation, coherence, stability and bias in automated evaluation."
  bibtex: |-
    @article{hirashima2026beyond,
      title   = {Beyond Hyper-Rationality: Persona-Driven Heterogeneity in Networked Agent-Based Systems},
      author  = {Hirashima, Shunya and Hu, Shiyu and Cheong, Kang Hao},
      journal = {IEEE Transactions on Network Science and Engineering},
      year    = {2026},
      doi     = {10.1109/TNSE.2026.3742449},
      note    = {Early Access}
