ICASSP25:
  source: "DOI 10.1109/ICASSP49660.2025.10888064 (Crossref/IEEE Xplore 10888064); abstract from IEEE Xplore (same as arXiv:2412.19648)"
  abstract: >-
    Vision-Language Tracking (VLT) aims to localize a target in video sequences using a visual
    template and language description. While textual cues enhance tracking potential, current
    datasets typically contain much more image data than text, limiting the ability of VLT methods
    to align the two modalities effectively. To address this imbalance, we propose a novel
    plug-and-play method named CTVLT that leverages the strong text-image alignment capabilities of
    foundation grounding models. CTVLT converts textual cues into interpretable visual heatmaps,
    which are easier for trackers to process. Specifically, we design a textual cue mapping module
    that transforms textual cues into target distribution heatmaps, visually representing the
    location described by the text. Additionally, the heatmap guidance module fuses these heatmaps
    with the search image to guide tracking more effectively. Extensive experiments on mainstream
    benchmarks demonstrate the effectiveness of our approach, achieving state-of-the-art performance
    and validating the utility of our method for enhanced VLT.
  contributions:
    - "Proposes CTVLT, a plug-and-play vision-language tracking method that uses the text-image alignment of foundation grounding models to convert textual cues into interpretable visual heatmaps."
    - "Designs a textual cue mapping module that transforms text into target distribution heatmaps, and a heatmap guidance module that fuses these heatmaps with the search image."
    - "Shows state-of-the-art performance on mainstream vision-language tracking benchmarks."
  bibtex: |-
    @inproceedings{feng2025enhancing,
      title     = {Enhancing Vision-Language Tracking by Effectively Converting Textual Cues into Visual Cues},
